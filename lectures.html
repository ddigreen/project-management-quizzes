}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

.table tbody tr:last-child :is(th, td) {

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

#widget {

  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {

.widget {

  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);

  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {

  padding: 0 !important;
  border: 0 !important;

.tooltip {

  left: 0;

  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),

  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);

  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  pointer-events: none;
  user-select: none;
}

.viz-grid {

}

.viz-stat {

}

.viz-stat-value {

.viz-row {

  align-items: center;
  gap: 10px;
}

hr {

  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);

  background: var(--accent);

}

small,
.text-small,
.viz-badge {

  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host&#x27;s design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {

oes the lecture mean when it describes projects as multifunctional?&quot;,&quot;options&quot;:[&quot;They cut across several functional lines&quot;,&quot;They must produce several unrelated products&quot;,&quot;They require several project managers with equal authority&quot;,&quot;They operate without human resources&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Multifunctional означает, что проект пересекает несколько функциональных направлений или подразделений.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-04&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[4],&quot;question&quot;:&quot;Which list gives the five process groups in the order presented in Lecture 1?&quot;,&quot;options&quot;:[&quot;Planning, staffing, directing, controlling, organizing&quot;,&quot;Initiation, design, procurement, operations, maintenance&quot;,&quot;Initiation, planning, execution, monitoring and control, closure&quot;,&quot;Selection, estimating, budgeting, reporting, auditing&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Лекция перечисляет пять групп: initiation, planning, execution, monitoring and control, closure.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-05&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;A company compares proposed projects under resource limits and identifies the benefits of the preferred project. Which process group does this illustrate?&quot;,&quot;options&quot;:[&quot;Execution&quot;,&quot;Initiation&quot;,&quot;Closure&quot;,&quot;Monitoring and control&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Выбор лучшего проекта при ограниченных ресурсах и выявление его выгод относятся к инициации.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-06&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;Which pair of activities belongs to project initiation?&quot;,&quot;options&quot;:[&quot;Preparing documents to sanction the project and assigning the project manager&quot;,&quot;Comparing actual outcomes with predictions and analyzing variances&quot;,&quot;Verifying completed work and closing charge numbers&quot;,&quot;Scheduling activities and defining the required quality of work&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Подготовка документов для санкционирования проекта и назначение руководителя входят в initiation.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-07&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[6],&quot;question&quot;:&quot;Name the five planning activities listed in the lecture.&quot;,&quot;answer&quot;:&quot;Define work requirements; define the quality and quantity of work; define the resources needed; schedule activities; evaluate the various risks.&quot;,&quot;explanation_ru&quot;:&quot;Планирование охватывает требования к работе, её качество и объём, необходимые ресурсы, расписание и оценку рисков.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-08&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[6],&quot;question&quot;:&quot;Before work begins, the FitMate team specifies how much testing is needed, identifies required resources, and evaluates risks. Which process group best matches these activities?&quot;,&quot;options&quot;:[&quot;Closure&quot;,&quot;Execution&quot;,&quot;Initiation&quot;,&quot;Planning&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Определение качества и количества работ, ресурсов и рисков прямо указано в группе planning.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-09&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;Which combination belongs to project execution?&quot;,&quot;options&quot;:[&quot;Selecting a project, sanctioning it, and assigning its manager&quot;,&quot;Closing contracts, charge numbers, and paperwork&quot;,&quot;Negotiating for team members, directing work, and helping team members improve&quot;,&quot;Setting work requirements, scheduling activities, and evaluating risks&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Execution включает переговоры о членах команды, руководство работой и помощь участникам в улучшении их работы.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-10&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[8],&quot;question&quot;:&quot;The team tracks progress, compares actual and predicted results, analyzes differences, and adjusts the work. Which process group is it applying?&quot;,&quot;options&quot;:[&quot;Monitoring and control&quot;,&quot;Initiation&quot;,&quot;Planning&quot;,&quot;Closure&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Эта последовательность воспроизводит четыре действия monitoring and control: отслеживание, сравнение, анализ отклонений и корректировки.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-11&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;During closure, what type of closure applies to (a) the contract, (b) charge numbers, and (c) paperwork? What must also be verified about the work?&quot;,&quot;answer&quot;:&quot;(a) Contractual closure; (b) financial closure; (c) administrative closure. The team must also verify that all of the work has been accomplished.&quot;,&quot;explanation_ru&quot;:&quot;Лекция различает договорное, финансовое и административное закрытие. Дополнительно проверяется выполнение всей работы.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-12&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Five project management process groups&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;A project has delivered its output, but its financial charge numbers and administrative paperwork remain open. According to the lecture, what is still incomplete?&quot;,&quot;options&quot;:[&quot;Project initiation&quot;,&quot;Project planning&quot;,&quot;Project closure&quot;,&quot;Project selection&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Передача результата не заменяет финансовое и административное закрытие, которые входят в project closure.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-13&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project success criteria&quot;,&quot;pages&quot;:[10],&quot;question&quot;:&quot;A project finishes on time and within cost, meets the desired technical level, and uses resources well, but the customer rejects the result. How does it compare with the lecture&#x27;s success criteria?&quot;,&quot;options&quot;:[&quot;It satisfies all criteria because customer acceptance is optional&quot;,&quot;It is successful if the project manager accepts it&quot;,&quot;It is successful whenever technical performance is achieved&quot;,&quot;It does not satisfy all criteria because customer acceptance is required&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Принятие результата заказчиком входит в определение успешного управления наряду со сроком, стоимостью, уровнем результата и использованием ресурсов.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-14&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project success criteria&quot;,&quot;pages&quot;:[10],&quot;question&quot;:&quot;Which statement accurately completes the lecture&#x27;s initial success definition: assigned resources should be used ...&quot;,&quot;options&quot;:[&quot;only when the customer requests them&quot;,&quot;effectively and efficiently&quot;,&quot;without considering time or cost&quot;,&quot;only after all project work is finished&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Успех предполагает результативное и эффективное использование выделенных ресурсов.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-15&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Benefits and obstacles of project management&quot;,&quot;pages&quot;:[12],&quot;question&quot;:&quot;Why is identifying functional responsibilities a potential benefit of project management?&quot;,&quot;options&quot;:[&quot;It removes the need for any responsibility assignments&quot;,&quot;It guarantees that personnel turnover cannot occur&quot;,&quot;It ensures that all activities are accounted for despite personnel turnover&quot;,&quot;It transfers all functional work to the customer&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Ясные функциональные обязанности помогают учитывать все работы независимо от смены персонала.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-16&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Benefits and obstacles of project management&quot;,&quot;pages&quot;:[12],&quot;question&quot;:&quot;State four lecture-listed benefits concerning scheduling, trade-off decisions, performance measurement, and problem response.&quot;,&quot;answer&quot;:&quot;Identify time limits for scheduling; identify a methodology for trade-off analysis; measure accomplishment against plans; identify problems early so that corrective action can follow.&quot;,&quot;explanation_ru&quot;:&quot;Эти преимущества связывают планирование сроков, анализ компромиссов, сравнение выполнения с планом и раннее исправление проблем.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-17&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Benefits and obstacles of project management&quot;,&quot;pages&quot;:[12],&quot;question&quot;:&quot;Which set contains only additional benefits stated in the lecture?&quot;,&quot;options&quot;:[&quot;Less need for continuous reporting, better future estimates, and knowledge of when objectives cannot be met or will be exceeded&quot;,&quot;No need for planning, elimination of all risks, and automatic customer acceptance&quot;,&quot;Guaranteed fixed scope, unlimited resources, and no reporting&quot;,&quot;Removal of line management, permanent teams, and fixed technology&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Слайд называет снижение необходимости постоянной отчётности, улучшение оценок для будущего планирования и понимание достижимости или превышения целей.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-18&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Benefits and obstacles of project management&quot;,&quot;pages&quot;:[13],&quot;question&quot;:&quot;List the six obstacles that the lecture says must be overcome to achieve the potential benefits of project management.&quot;,&quot;answer&quot;:&quot;Project complexity; the customer&#x27;s special requirements and scope changes; organizational restructuring; project risks; changes in technology; forward planning and pricing.&quot;,&quot;explanation_ru&quot;:&quot;Ответ сохраняет шесть групп препятствий из лекции, включая отдельно указанные forward planning and pricing.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-19&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Systems approach and management functions&quot;,&quot;pages&quot;:[14],&quot;question&quot;:&quot;In Figure 1, &#x27;Why are systems necessary?&#x27;, what results from management gaps combined with functional gaps caused by departmentalization?&quot;,&quot;options&quot;:[&quot;A single integrated reporting line&quot;,&quot;Operational islands&quot;,&quot;Automatic coordination between all departments&quot;,&quot;Elimination of organizational levels&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;На рисунке management gaps плюс functional gaps (departmentalization) приводят к operational islands, то есть обособленным операционным участкам.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-20&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Systems approach and management functions&quot;,&quot;pages&quot;:[14],&quot;question&quot;:&quot;Which mapping of organizational levels to activities matches Figure 1?&quot;,&quot;options&quot;:[&quot;Top management: operations; middle management: scheduling; supervisors: policy; laborers: planning&quot;,&quot;Top management: scheduling; middle management: policy; supervisors: operations; laborers: planning&quot;,&quot;Top management: planning; middle management: operations; supervisors: policy; laborers: scheduling&quot;,&quot;Top management: policy; middle management: planning; supervisors: scheduling; laborers: operations&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Рисунок сопоставляет верхнее руководство с политикой, среднее с планированием, руководителей работ с составлением расписаний, работников с операциями.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-21&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Systems approach and management functions&quot;,&quot;pages&quot;:[15],&quot;question&quot;:&quot;Which description best matches the lecture&#x27;s overview definition of project management?&quot;,&quot;options&quot;:[&quot;Planning, organizing, directing, and controlling company resources for an established relatively short-term objective&quot;,&quot;Staffing permanent departments without any specific project goals&quot;,&quot;Directing only financial resources after the project has closed&quot;,&quot;Maintaining repetitive operations without a specific end objective&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Обзорное определение перечисляет planning, organizing, directing и controlling ресурсов компании ради установленной относительно краткосрочной цели.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-22&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Systems approach and management functions&quot;,&quot;pages&quot;:[15],&quot;question&quot;:&quot;How does the systems approach connect functional personnel to a specific project in the lecture?&quot;,&quot;options&quot;:[&quot;It removes both the functional and project hierarchies&quot;,&quot;It assigns all customers to the vertical hierarchy&quot;,&quot;It assigns functional personnel from the vertical hierarchy to the horizontal project hierarchy&quot;,&quot;It makes the project manager the permanent head of every department&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;В системном подходе функциональные сотрудники вертикальной иерархии назначаются на конкретный проект, представленный горизонтальной иерархией.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-23&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Systems approach and management functions&quot;,&quot;pages&quot;:[16,17],&quot;question&quot;:&quot;Which classical management function is intentionally omitted from the lecture&#x27;s overview definition of project management?&quot;,&quot;options&quot;:[&quot;Planning&quot;,&quot;Controlling&quot;,&quot;Directing&quot;,&quot;Staffing&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Пять классических функций: planning, organizing, staffing, controlling, directing. Staffing намеренно исключена из определения управления проектом, поскольку считается обязанностью линейного руководства.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-24&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project manager and line manager interface&quot;,&quot;pages&quot;:[17],&quot;question&quot;:&quot;A project manager requests a particular specialist. According to the lecture, who makes the final decision about which resources will be committed?&quot;,&quot;options&quot;:[&quot;The project manager alone&quot;,&quot;The line managers&quot;,&quot;The requested specialist alone&quot;,&quot;The customer in every case&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Руководитель проекта вправе запрашивать конкретные ресурсы, но окончательное решение об их выделении принимает линейное руководство.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-25&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project success criteria&quot;,&quot;pages&quot;:[18],&quot;question&quot;:&quot;Which description accurately represents Figure 2, &#x27;Overview of project management&#x27;?&quot;,&quot;options&quot;:[&quot;Scope, risk, and staffing form the triangle, with profits at its center&quot;,&quot;Customer relations form one triangle side, and technology is excluded&quot;,&quot;Time, cost, and performance/technology form the triangle, resources are inside, and good customer relations surround it&quot;,&quot;Money, manpower, and equipment form the triangle, and reporting surrounds it&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;На рисунке стороны треугольника обозначают time, cost, performance/technology; внутри находятся resources, вокруг - good customer relations.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-26&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Deliverables and project manager selection&quot;,&quot;pages&quot;:[19],&quot;question&quot;:&quot;When can a deliverable occur according to the lecture?&quot;,&quot;options&quot;:[&quot;At the completion of the project or at the end of a project life-cycle phase&quot;,&quot;Only after the entire project has closed financially&quot;,&quot;Only before execution begins&quot;,&quot;Only when a physical product is sold&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Deliverable - выход или конечный результат завершения проекта либо одной из фаз его жизненного цикла.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-27&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Deliverables and project manager selection&quot;,&quot;pages&quot;:[19,22],&quot;question&quot;:&quot;Which factors does the lecture identify as influencing project manager selection?&quot;,&quot;options&quot;:[&quot;Only the manager&#x27;s position in the organizational chart&quot;,&quot;Only the planned duration of the project&quot;,&quot;Only whether the result is a physical item&quot;,&quot;The size, nature, and scope of deliverables, as well as stakeholders&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Лекция связывает выбор руководителя с размером, характером и масштабом результатов, а также с заинтересованными сторонами.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-28&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Deliverables and project manager selection&quot;,&quot;pages&quot;:[20],&quot;question&quot;:&quot;Which item best matches a hardware deliverable as described in the lecture?&quot;,&quot;options&quot;:[&quot;A written study&quot;,&quot;A piece of equipment&quot;,&quot;A documentation handout&quot;,&quot;A final written report&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Hardware deliverables включают материальные предметы, например стол, прототип или оборудование.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-29&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Deliverables and project manager selection&quot;,&quot;pages&quot;:[20],&quot;question&quot;:&quot;Using the lecture&#x27;s specific terminology, which item is a software deliverable?&quot;,&quot;options&quot;:[&quot;A report or study prepared as a paper product&quot;,&quot;A laboratory table&quot;,&quot;A piece of production equipment&quot;,&quot;A physical hardware prototype&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Именно в этой лекции software deliverables обычно означают бумажные продукты: reports, studies, handouts, documentation. Некоторые компании не разделяют hardware и software deliverables.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-30&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Deliverables and project manager selection&quot;,&quot;pages&quot;:[20],&quot;question&quot;:&quot;A team issues a series of reports that progressively develop into a final report. How does the lecture classify these intermediate outputs?&quot;,&quot;options&quot;:[&quot;Project risks&quot;,&quot;Capital market resources&quot;,&quot;Interim deliverables&quot;,&quot;Administrative closure records in every case&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Interim deliverables развиваются по мере проекта и могут быть аппаратными или документальными; пример лекции - промежуточные отчёты перед финальным.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-31&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder definition and categories&quot;,&quot;pages&quot;:[22],&quot;question&quot;:&quot;Which definition of stakeholders matches the lecture?&quot;,&quot;options&quot;:[&quot;Only people who fund the project&quot;,&quot;Individuals or organizations that can be favorably or unfavorably impacted by the project&quot;,&quot;Only members of the project team&quot;,&quot;Only customers who have already accepted the result&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Stakeholders могут быть отдельными людьми или организациями, на которых проект влияет положительно либо отрицательно.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-32&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder definition and categories&quot;,&quot;pages&quot;:[22],&quot;question&quot;:&quot;Why must a project manager interface with stakeholders according to the lecture?&quot;,&quot;options&quot;:[&quot;All stakeholders automatically become project employees&quot;,&quot;Stakeholders always approve every project decision&quot;,&quot;Stakeholders remove the need for customer acceptance&quot;,&quot;Many stakeholders can exert influence or pressure over the project&#x27;s direction&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Заинтересованные стороны могут влиять на направление проекта или оказывать давление, поэтому руководителю нужно с ними взаимодействовать.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-33&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder definition and categories&quot;,&quot;pages&quot;:[23],&quot;question&quot;:&quot;Which statement accurately describes the stakeholder categorization in the lecture?&quot;,&quot;options&quot;:[&quot;It is a universal system that every company must use unchanged&quot;,&quot;It consists only of internal and external project managers&quot;,&quot;Each company has its own system; a typical one includes organizational, product/market, and capital market stakeholders&quot;,&quot;It categorizes stakeholders only by the amount of money they contribute&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Лекция подчёркивает, что у компаний бывают собственные системы, и приводит три категории как типовой пример.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-34&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder definition and categories&quot;,&quot;pages&quot;:[24],&quot;question&quot;:&quot;Which group consists entirely of organizational stakeholders in the lecture&#x27;s typical system?&quot;,&quot;options&quot;:[&quot;Executive officers, line managers, employees, and unions&quot;,&quot;Customers, suppliers, governments, and the general public&quot;,&quot;Shareholders, creditors, banks, and customers&quot;,&quot;Local committees, creditors, employees, and banks&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Organizational stakeholders: executive officers, line managers, employees, unions.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-35&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder definition and categories&quot;,&quot;pages&quot;:[25],&quot;question&quot;:&quot;Which group consists entirely of product/market stakeholders in the lecture&#x27;s typical system?&quot;,&quot;options&quot;:[&quot;Banks, creditors, and shareholders&quot;,&quot;Executive officers, employees, and unions&quot;,&quot;Line managers, shareholders, and creditors&quot;,&quot;Customers, suppliers, local committees, governments, and the general public&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Product/market stakeholders включают клиентов, поставщиков, местные комитеты, органы власти местного, регионального и федерального уровней и общественность.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-36&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder definition and categories&quot;,&quot;pages&quot;:[26],&quot;question&quot;:&quot;A bank, a creditor, and a shareholder are involved in a project. Which stakeholder category contains all three in the lecture?&quot;,&quot;options&quot;:[&quot;Organizational&quot;,&quot;Capital market&quot;,&quot;Product/market&quot;,&quot;Project team only&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Shareholders, creditors и banks перечислены в категории capital market stakeholders.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-37&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder interest-influence map&quot;,&quot;pages&quot;:[27],&quot;question&quot;:&quot;Which variables form the two axes of the stakeholder map in Figure 3?&quot;,&quot;options&quot;:[&quot;Stakeholder interest and stakeholder influence&quot;,&quot;Project duration and project cost&quot;,&quot;Customer acceptance and technical performance&quot;,&quot;Stakeholder seniority and number of employees&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Вертикальная ось показывает interest, горизонтальная - influence; обе возрастают в положительном направлении.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-38&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder interest-influence map&quot;,&quot;pages&quot;:[27],&quot;question&quot;:&quot;A stakeholder has high interest and high influence. Which action does Figure 3 prescribe?&quot;,&quot;options&quot;:[&quot;Regular minimal contact&quot;,&quot;Keep completely informed&quot;,&quot;Manage most thoroughly&quot;,&quot;Anticipate and meet needs&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Правый верхний квадрант, high interest и high influence, подписан Manage most thoroughly.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-39&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder interest-influence map&quot;,&quot;pages&quot;:[27],&quot;question&quot;:&quot;A stakeholder has high interest but low influence. Which action does Figure 3 prescribe?&quot;,&quot;options&quot;:[&quot;Anticipate and meet needs&quot;,&quot;Regular minimal contact&quot;,&quot;Manage most thoroughly&quot;,&quot;Keep completely informed&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Для высокого интереса и низкого влияния левый верхний квадрант рекомендует Keep completely informed.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-40&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder interest-influence map&quot;,&quot;pages&quot;:[27],&quot;question&quot;:&quot;A stakeholder has low interest but high influence. Which action does Figure 3 prescribe?&quot;,&quot;options&quot;:[&quot;Manage most thoroughly&quot;,&quot;Anticipate and meet needs&quot;,&quot;Keep completely informed&quot;,&quot;Regular minimal contact&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Низкий интерес и высокое влияние соответствуют правому нижнему квадранту Anticipate and meet needs.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-41&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholder interest-influence map&quot;,&quot;pages&quot;:[27],&quot;question&quot;:&quot;A stakeholder has low interest and low influence. Which action does Figure 3 prescribe?&quot;,&quot;options&quot;:[&quot;Regular minimal contact&quot;,&quot;Manage most thoroughly&quot;,&quot;Anticipate and meet needs&quot;,&quot;Keep completely informed&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Левый нижний квадрант карты рекомендует Regular minimal contact.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-42&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project success criteria&quot;,&quot;pages&quot;:[28],&quot;question&quot;:&quot;Which position on scope changes matches the lecture&#x27;s modified definition of project success?&quot;,&quot;options&quot;:[&quot;Success requires every proposed scope change to be accepted&quot;,&quot;Scope changes are irrelevant once the budget is approved&quot;,&quot;Scope changes should be minimum or mutually agreed upon&quot;,&quot;Any scope change automatically means project failure&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Лекция допускает минимальные или взаимно согласованные изменения объёма работ, а не требует абсолютного отсутствия изменений.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-43&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project success criteria&quot;,&quot;pages&quot;:[28],&quot;question&quot;:&quot;A project meets time, cost, technical, customer-acceptance, and scope-change criteria, but disrupts the organization&#x27;s main work flow and changes its corporate culture. Which conclusion follows from the lecture&#x27;s modified definition?&quot;,&quot;options&quot;:[&quot;It satisfies all listed criteria because organizational effects are excluded&quot;,&quot;It satisfies all criteria whenever the customer accepts the result&quot;,&quot;Its success depends only on whether the project manager is promoted&quot;,&quot;It does not satisfy all listed criteria because work flow and corporate culture also matter&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Расширенное определение требует завершения без нарушения основного рабочего потока организации и без изменения корпоративной культуры.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-44&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Project manager and line manager interface&quot;,&quot;pages&quot;:[29],&quot;question&quot;:&quot;Name the six resource categories listed under the project manager-line manager interface.&quot;,&quot;answer&quot;:&quot;Money; manpower; equipment; facilities; materials; information/technology.&quot;,&quot;explanation_ru&quot;:&quot;Список охватывает деньги, персонал, оборудование, помещения или мощности, материалы и информацию/технологии.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-45&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project manager and line manager interface&quot;,&quot;pages&quot;:[30],&quot;question&quot;:&quot;Which reporting arrangement is identified as important for successful project management?&quot;,&quot;options&quot;:[&quot;Functional employees report only to customers&quot;,&quot;Functional employees can report vertically to line managers and horizontally to one or more project managers&quot;,&quot;Functional employees stop reporting to line managers as soon as a project starts&quot;,&quot;Every employee must report to exactly one project manager and no one else&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Лекция выделяет способность функциональных сотрудников одновременно отчитываться по вертикали линейным руководителям и по горизонтали одному или нескольким руководителям проектов.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-46&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project manager and line manager interface&quot;,&quot;pages&quot;:[30],&quot;question&quot;:&quot;Which relationship does the lecture identify as a strong dependency of successful project management?&quot;,&quot;options&quot;:[&quot;A good daily working relationship between the project manager and line managers who directly assign resources&quot;,&quot;A relationship limited to the final project review&quot;,&quot;A relationship in which line managers never discuss resource assignments&quot;,&quot;A relationship that excludes functional employees from projects&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Успех зависит от хороших повседневных рабочих отношений руководителя проекта с линейными руководителями, непосредственно выделяющими ресурсы.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-47&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Integration and interface management&quot;,&quot;pages&quot;:[31],&quot;question&quot;:&quot;Which activities make up the project manager&#x27;s integration role in the lecture?&quot;,&quot;options&quot;:[&quot;Only preparing the original plan&quot;,&quot;Only directing execution after the plan is approved&quot;,&quot;Integrating activities to develop the plan, execute the plan, and make changes to the plan&quot;,&quot;Replacing all functional management activities with customer decisions&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Интеграция охватывает разработку плана, его выполнение и внесение изменений в него.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-48&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Integration and interface management&quot;,&quot;pages&quot;:[32],&quot;question&quot;:&quot;Which input-process-output description matches Figure 4?&quot;,&quot;options&quot;:[&quot;Products, services, and profits enter an audit process that produces personnel&quot;,&quot;Only capital enters the process, and only profits can result&quot;,&quot;Customers and creditors enter the process, and staffing is its only output&quot;,&quot;Capital, materials, equipment, facilities, information, and personnel enter integrated processes that produce products, services, and profits&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Рисунок показывает шесть ресурсных входов, integrated processes в центре и три выхода: products, services, profits.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-49&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Integration and interface management&quot;,&quot;pages&quot;:[33],&quot;question&quot;:&quot;List the four relationship areas covered by interface management in the lecture. Include the distinction made about the customer&#x27;s organization.&quot;,&quot;answer&quot;:&quot;Relationships within the project team; between the project team and functional organizations; between the project team and senior management; and between the project team and the customer&#x27;s organization, which may be internal or external.&quot;,&quot;explanation_ru&quot;:&quot;Interface management означает управление отношениями внутри команды и на её границах с функциональными подразделениями, высшим руководством и внутренним или внешним заказчиком.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L1-50&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project manager as a general manager&quot;,&quot;pages&quot;:[34],&quot;question&quot;:&quot;Why does the lecture describe project management as a training ground for future general managers?&quot;,&quot;options&quot;:[&quot;Project managers need to know only their own technical specialty&quot;,&quot;Project managers learn the company&#x27;s total operation and can prepare for top management positions&quot;,&quot;Project managers are responsible only for administrative paperwork&quot;,&quot;Project managers are excluded from relationships with senior management&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;По лекции руководитель проекта фактически действует как general manager, узнаёт работу компании в целом и приобретает подготовку к высшим управленческим должностям.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:1},{&quot;id&quot;:&quot;L2-01&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning responsibilities&quot;,&quot;pages&quot;:[2],&quot;question&quot;:&quot;Why does the lecture call for formal detailed planning and integration of plans across functional units?&quot;,&quot;options&quot;:[&quot;Integration removes the need to execute the plans.&quot;,&quot;Each functional plan must remain independent of the overall project.&quot;,&quot;Integration guarantees that resources are unlimited.&quot;,&quot;Projects often have short durations and prioritized resource control, while functional units may prepare plans without sufficient regard for one another.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Планирование, интеграция и исполнение — основные обязанности менеджера. Краткие сроки и контроль ресурсов требуют подробного плана; изолированные планы подразделений нужно согласовывать.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-02&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Meaning of planning&quot;,&quot;pages&quot;:[2],&quot;question&quot;:&quot;How does the lecture describe planning in a project environment?&quot;,&quot;options&quot;:[&quot;Recording only what has already happened.&quot;,&quot;Selecting staff without defining objectives or actions.&quot;,&quot;Waiting until all uncertainty has disappeared before choosing actions.&quot;,&quot;Establishing a predetermined course of action within a forecasted environment.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Планирование определяет заранее выбранный порядок действий в прогнозируемых условиях. В общем определении оно также связывает цели с политиками, процедурами и программами.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-03&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Milestones and management alternatives&quot;,&quot;pages&quot;:[2],&quot;question&quot;:&quot;Line managers cannot commit to milestones because they consider them unrealistic. What response follows the lecture?&quot;,&quot;options&quot;:[&quot;The project manager ignores their concerns because milestones cannot change.&quot;,&quot;The project manager develops alternatives, possibly moving milestones, and upper management participates in selecting an alternative.&quot;,&quot;Every line manager changes the project finish date independently.&quot;,&quot;The project manager removes all milestones and stops planning.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Основные вехи задаются требованиями проекта. Если они нереалистичны, менеджер предлагает варианты, а высшее руководство участвует в выборе.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-04&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning throughout the life cycle&quot;,&quot;pages&quot;:[3],&quot;question&quot;:&quot;Which statement best describes effective project planning?&quot;,&quot;options&quot;:[&quot;It occurs only once, after execution has started.&quot;,&quot;It must reject input from other functions to remain consistent.&quot;,&quot;It is flexible only if all reviews and controls are removed.&quot;,&quot;It is systematic, flexible, reviewed and controlled, accepts multifunctional inputs, and continues iteratively throughout the project.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Лекция сочетает системность и гибкость с дисциплиной, контролем и межфункциональным участием. Планирование продолжается весь жизненный цикл.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-05&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Uncertainty and work definition&quot;,&quot;pages&quot;:[3],&quot;question&quot;:&quot;A team understands a task poorly before execution. Which outcome does the lecture say is likely?&quot;,&quot;options&quot;:[&quot;The team will need less information than for a well-understood task.&quot;,&quot;Resource allocations and priorities can never change after planning.&quot;,&quot;The task can be omitted from the project plan because it is uncertain.&quot;,&quot;Learning during execution may change resource allocations, schedules and priorities, while greater uncertainty requires processing more information.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Цель планирования — определить всю необходимую работу. Непонятная задача требует дополнительной информации, а новые знания могут менять ресурсы, сроки и приоритеты.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-06&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Poor planning versus purposes of planning&quot;,&quot;pages&quot;:[4],&quot;question&quot;:&quot;The slide places two kinds of statements in one list. Separate them: name three consequences of poor planning and all four positive purposes of planning shown in the lecture.&quot;,&quot;answer&quot;:&quot;Consequences include initiation without defined requirements, wild enthusiasm, disillusionment, chaos, searching for the guilty, punishing the innocent, and promoting nonparticipants (any three). Purposes: reduce uncertainty; improve operational efficiency; understand objectives better; provide a basis for monitoring and controlling work.&quot;,&quot;explanation_ru&quot;:&quot;На странице 4 последние четыре пункта логически являются целями планирования, хотя отдельный подзаголовок отсутствует. Не следует считать повышение эффективности последствием плохого планирования.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-07&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning and control feedback&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;Which sequence reflects the planning and control system in Figure 1?&quot;,&quot;options&quot;:[&quot;Budgets → no schedules → eliminate reporting → remove objectives.&quot;,&quot;Reports → finish the project → define requirements for the first time.&quot;,&quot;Goals and objectives → work descriptions/specifications/SOW/WBS → network scheduling → schedules → budgets → tracking and reports → feedback to management decisions.&quot;,&quot;Objectives → execute without work descriptions → ignore performance data.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Схема связывает цели, описание работ, сетевое планирование, графики, бюджеты, отслеживание и отчеты. Обратная связь возвращается к управленческим решениям.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-08&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning components: objective and program&quot;,&quot;pages&quot;:[6],&quot;question&quot;:&quot;A plan states a target to be achieved by a stated date and then sets out a strategy and major actions for achieving it. What are these two components?&quot;,&quot;options&quot;:[&quot;Objective and program, respectively.&quot;,&quot;Budget and standard, respectively.&quot;,&quot;Forecast and organization, respectively.&quot;,&quot;Procedure and schedule, respectively.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Objective — цель к определенному сроку. Program — стратегия и основные действия для ее достижения. Планирование в целом отвечает на вопросы: что, кем и когда должно быть сделано.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-09&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning components: schedule and budget&quot;,&quot;pages&quot;:[6],&quot;question&quot;:&quot;Which pairing correctly matches a planning component to its meaning?&quot;,&quot;options&quot;:[&quot;Schedule: acceptable performance level. Budget: position descriptions.&quot;,&quot;Schedule: general decision guide. Budget: a projection of future events.&quot;,&quot;Schedule: activity start/finish timing. Budget: planned expenditures needed to achieve objectives.&quot;,&quot;Schedule: detailed policy implementation method. Budget: project milestones only.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;График описывает сроки начала и завершения, а бюджет — планируемые расходы.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-10&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning components: forecast and standard&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;Which pair correctly distinguishes a forecast from a standard?&quot;,&quot;options&quot;:[&quot;A forecast projects what will happen by a certain time; a standard defines an adequate or acceptable performance level.&quot;,&quot;A forecast assigns duties; a standard forecasts resource prices.&quot;,&quot;A forecast is a detailed procedure; a standard is an activity finish date.&quot;,&quot;A forecast approves scope; a standard identifies the sponsor.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Forecast — прогноз будущего состояния. Standard — приемлемый уровень индивидуальной или групповой результативности.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-11&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning components: policy and procedure&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;A company gives a general guide for decisions and also a detailed method for applying that guide. Which terms apply?&quot;,&quot;options&quot;:[&quot;Procedure and policy, respectively.&quot;,&quot;Policy and procedure, respectively.&quot;,&quot;Program and forecast, respectively.&quot;,&quot;Budget and organization, respectively.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Policy задает общее руководство для решений и действий. Procedure описывает подробный способ выполнения политики.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-12&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Planning components: organization&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;Which planning component specifies the number and kinds of positions, together with their duties and responsibilities?&quot;,&quot;options&quot;:[&quot;Standard.&quot;,&quot;Forecast.&quot;,&quot;Organization.&quot;,&quot;Schedule.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Organization описывает структуру должностей и соответствующие обязанности. Это один из девяти элементов вместе с objective, program, schedule, budget, forecast, policy, procedure и standard.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-13&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project charter purpose&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;What is the central purpose of the project charter as described in the lecture?&quot;,&quot;options&quot;:[&quot;To replace all project work with a price quotation.&quot;,&quot;To identify the project manager’s authority and responsibility and the management- and/or customer-approved project scope.&quot;,&quot;To record only historical costs after completion.&quot;,&quot;To guarantee that no stakeholder can request changes.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Устав закрепляет полномочия и ответственность менеджера, а также согласованный объем проекта. Лекция называет его внутренним юридическим документом.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-14&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project charter preparation and signature&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;Who theoretically prepares and signs the charter, and what practical variation does the lecture describe?&quot;,&quot;options&quot;:[&quot;The sponsor prepares and signs it; in practice, the project manager may prepare it for the sponsor’s signature.&quot;,&quot;The customer’s contractor must always prepare and sign it alone.&quot;,&quot;The project manager must sign on behalf of every stakeholder without approval.&quot;,&quot;Every team member must prepare a separate charter.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Теоретически автор и подписант — спонсор. На практике менеджер может подготовить документ, сохранив подпись спонсора.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-15&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Minimum charter contents&quot;,&quot;pages&quot;:[10],&quot;question&quot;:&quot;Which set contains only minimum charter contents listed in the lecture?&quot;,&quot;options&quot;:[&quot;Project manager and resource authority; business purpose with assumptions and constraints; project description and scope including inclusions and exclusions.&quot;,&quot;Only staff holidays, office layout and competitor slogans.&quot;,&quot;Only final invoices, lessons learned and an archived test report.&quot;,&quot;Only the project name, with no purpose, scope or authority.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Минимум включает менеджера и его полномочия, деловую цель, допущения и ограничения, описание, цели и границы объема проекта.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-16&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Stakeholders and risks in the charter&quot;,&quot;pages&quot;:[10],&quot;question&quot;:&quot;Which additional information belongs in the charter according to the lecture?&quot;,&quot;options&quot;:[&quot;Only the sponsor’s preferred chart colors.&quot;,&quot;A guarantee that every risk has already disappeared.&quot;,&quot;Key stakeholders and their roles, relevant stakeholder involvement, risks, and a summary of conditions defining the project.&quot;,&quot;An instruction to exclude all stakeholder roles until execution.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Лекция отдельно включает заинтересованные стороны, их роли и участие, риски и условия, определяющие проект.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-17&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Expanded charter contents&quot;,&quot;pages&quot;:[11],&quot;question&quot;:&quot;A company uses the detailed charter described in the lecture. Name four items defining the work, timing or spending, and four items concerning management, resources or organizational relationships.&quot;,&quot;answer&quot;:&quot;Work/timing/spending examples: scope baseline or scope statement; scope and objectives/SOW; specifications; WBS template levels; timing; spending plan/S-curve (any four). Management/resources/relationships examples: management plan; resource requirements and man loading; key-personnel resumes; organizational relationships and structure; responsibility assignment matrix; support from other organizations; project policies and procedures; change management plan; management approval (any four).&quot;,&quot;explanation_ru&quot;:&quot;Расширенный устав объединяет описание работ и план их управления. Эти подробности приведены как практика некоторых компаний, а не как обязательный минимум каждого устава.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-18&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Example charter authority&quot;,&quot;pages&quot;:[8],&quot;question&quot;:&quot;In the example charter in Figure 2, which statement correctly combines an authority and a condition attached to it?&quot;,&quot;options&quot;:[&quot;The manager may revise the plan only after the project has ended.&quot;,&quot;The manager must transfer all customer communication to unrelated outsiders.&quot;,&quot;The manager may revise the project plan as needed with customer approval, and may delegate to functional personnel with the line manager’s approval of their capability.&quot;,&quot;The manager may delegate unlimited authority while bypassing line managers.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;На примере устава показаны не только полномочия, но и условия их применения. Пересмотр плана требует согласия клиента, а делегирование учитывает согласие линейного руководителя.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-19&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Scheduling techniques and abbreviations&quot;,&quot;pages&quot;:[13],&quot;question&quot;:&quot;Name the four general scheduling techniques listed before the named network methods. Then expand PERT, ADM, PDM and GERT as given in the lecture.&quot;,&quot;answer&quot;:&quot;General techniques: Gantt/bar charts, milestone charts, line of balance, and networks. PERT: Program Evaluation and Review Technique. ADM: Arrow Diagram Method. PDM: Precedence Diagram Method. GERT: Graphical Evaluation and Review Technique. The slide says ADM is sometimes called CPM, Critical Path Method.&quot;,&quot;explanation_ru&quot;:&quot;Нужно узнавать перечисленные методы и расшифровки. Формулировка об ADM/CPM передает именно терминологию слайда; вычисления критического пути рассматриваются отдельно.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-20&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Purpose of network planning&quot;,&quot;pages&quot;:[14],&quot;question&quot;:&quot;What does the lecture identify as the primary purpose of network planning?&quot;,&quot;options&quot;:[&quot;To hide activity interdependencies from managers.&quot;,&quot;To replace all resource decisions with a drawing.&quot;,&quot;To reduce the need for crisis management through a pictorial representation of the total program.&quot;,&quot;To show costs without any relation to time or work.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Сетевое представление помогает заранее увидеть взаимосвязи и проблемы, вместо постоянного управления кризисами.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-21&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Management information from a network&quot;,&quot;pages&quot;:[14],&quot;question&quot;:&quot;Which set of questions can network analysis help management investigate?&quot;,&quot;options&quot;:[&quot;Only the project logo and presentation font.&quot;,&quot;Only historical expenditure, with no timing or dependency information.&quot;,&quot;Completion time, effects of early or late starts, resource–time trade-offs, what-if scenarios, crash-program costs and performance slippage.&quot;,&quot;Only employee preferences unrelated to activities.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Сеть дает данные для планирования, интеграции, исследований времени, графика и ресурсов. Лекция также включает взаимозависимости и оценку исполнения.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-22&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Event, activity, duration and effort&quot;,&quot;pages&quot;:[15],&quot;question&quot;:&quot;Which statement uses the network terms correctly?&quot;,&quot;options&quot;:[&quot;An event is always a month of work and duration equals staff headcount.&quot;,&quot;An event is a start/finish milestone, an activity is work, duration is total elapsed time, and effort is the work actually performed within that time.&quot;,&quot;Activity and milestone always mean the same thing.&quot;,&quot;An activity lasting one month must require one full month of effort.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Лекция специально различает duration и effort: при длительности один месяц фактическая работа может занимать лишь две недели.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-23&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Critical path definition&quot;,&quot;pages&quot;:[15],&quot;question&quot;:&quot;Why can the longest path through a project network also determine the shortest possible project completion time?&quot;,&quot;options&quot;:[&quot;All required work must finish, so the longest dependent sequence sets the earliest feasible project completion under the stated plan.&quot;,&quot;The longest path contains only optional activities that can be skipped.&quot;,&quot;The shortest path always determines the project finish regardless of other work.&quot;,&quot;Adding every parallel activity duration is required to find the finish date.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Проект нельзя закончить раньше завершения самой длинной обязательной
