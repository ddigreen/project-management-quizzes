        const label = document.createElement(&#x27;label&#x27;);
        label.className = &#x27;form-check&#x27;;
        if (m.reveal &amp;&amp; q.answer === letters[index]) label.classList.add(&#x27;pm-correct&#x27;);
        else if (m.reveal &amp;&amp; m.choice === index) label.classList.add(&#x27;pm-wrong&#x27;);
        const input = document.createElement(&#x27;input&#x27;);
        input.className = &#x27;form-check-input&#x27;; input.type = &#x27;radio&#x27;; input.name = &#x27;pm-choice&#x27;;
        input.value = String(index); input.checked = m.choice === index; input.disabled = m.reveal;
        const text = document.createElement(&#x27;span&#x27;); text.className = &#x27;form-check-label&#x27;;
        text.textContent = letters[index] + &#x27;. &#x27; + option;
        label.append(input, text); el(&#x27;options&#x27;).append(label);
        input.addEventListener(&#x27;change&#x27;, () =&gt; {
          ensureMark(q).choice = index; el(&#x27;check&#x27;).disabled = false; persist();
        });
      });
    }
    el(&#x27;answer&#x27;).value = m.text || &#x27;&#x27;;
    el(&#x27;answer&#x27;).readOnly = m.reveal;
    el(&#x27;check-actions&#x27;).hidden = m.reveal;
    el(&#x27;check&#x27;).textContent = written ? &#x27;Сравнить с эталоном&#x27; : &#x27;Проверить&#x27;;
    el(&#x27;check&#x27;).disabled = written ? !m.text?.trim() : m.choice &lt; 0;
    el(&#x27;feedback&#x27;).hidden = !m.reveal;
    if (m.reveal) {
      const pending = written &amp;&amp; !m.status;
      el(&#x27;verdict&#x27;).className = m.status === &#x27;c&#x27; ? &#x27;pm-status-c&#x27; : m.status === &#x27;w&#x27; ? &#x27;pm-status-w&#x27; : &#x27;&#x27;;
      el(&#x27;verdict&#x27;).textContent = pending ? &#x27;Эталон открыт · самопроверка&#x27; :
        m.status === &#x27;c&#x27; ? (written ? &#x27;✓ Отмечено: совпадает&#x27; : &#x27;✓ Верно&#x27;) :
        m.status === &#x27;p&#x27; ? &#x27;◐ Отмечено: частично&#x27; : &#x27;↻ Нужно повторить&#x27;;
      el(&#x27;model-label&#x27;).textContent = written ? &#x27;Эталон&#x27; : &#x27;Правильный ответ&#x27;;
      el(&#x27;model&#x27;).textContent = written ? q.answer : q.answer + &#x27;. &#x27; + q.options[letters.indexOf(q.answer)];
      el(&#x27;explanation&#x27;).textContent = q.explanation_ru;
      el(&#x27;source&#x27;).textContent = &#x27;Источник: Lecture &#x27; + q.lecture + &#x27;, PDF стр. &#x27; + q.pages.join(&#x27;, &#x27;);
      el(&#x27;self-wrap&#x27;).hidden = !pending;
    }
    el(&#x27;prev&#x27;).disabled = state.at === 0;
    el(&#x27;next&#x27;).disabled = written &amp;&amp; m.reveal &amp;&amp; !m.status;
    el(&#x27;next&#x27;).textContent = state.at === state.queue.length-1 ? &#x27;К результатам →&#x27; : m.status ? &#x27;Следующий →&#x27; : &#x27;Пропустить →&#x27;;
  }
  function check(unknown) {
    const q = current(); if (!q) return;
    const m = ensureMark(q);
    if (m.reveal) return;
    if (!unknown &amp;&amp; (q.type === &#x27;mcq&#x27; ? m.choice &lt; 0 : !m.text.trim())) return;
    m.reveal = true;
    if (unknown) m.status = &#x27;w&#x27;;
    else if (q.type === &#x27;mcq&#x27;) m.status = letters[m.choice] === q.answer ? &#x27;c&#x27; : &#x27;w&#x27;;
    renderQuestion(); persist();
  }
  function renderResults() {
    const s = stats();
    el(&#x27;results-title&#x27;).textContent = s.checked === state.queue.length ? &#x27;Тренировка завершена&#x27; : &#x27;Текущий результат&#x27;;
    el(&#x27;auto-score&#x27;).textContent = s.autoDone ? s.autoCorrect + &#x27; / &#x27; + s.autoDone : &#x27;—&#x27;;
    el(&#x27;auto-detail&#x27;).textContent = &#x27;Верно среди проверенных · всего &#x27; + s.autoTotal;
    el(&#x27;self-score&#x27;).textContent = s.selfDone ? s.selfCorrect + &#x27; / &#x27; + s.selfDone : &#x27;—&#x27;;
    el(&#x27;self-detail&#x27;).textContent = &#x27;Отмечено «совпадает» · частично &#x27; + s.partial + &#x27; · всего &#x27; + s.selfTotal;
    const unfinished = state.queue.length - s.checked;
    el(&#x27;review-label&#x27;).textContent = s.review.length ?
