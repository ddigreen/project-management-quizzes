 последовательности работ. Поэтому длиннейший путь определяет минимальную длительность проекта.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-24&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;PERT diagram symbols&quot;,&quot;pages&quot;:[16],&quot;question&quot;:&quot;In Figure 3, two circles labelled with events are joined by an arrow labelled “3 weeks.” What does each element represent?&quot;,&quot;options&quot;:[&quot;Circles represent departments, the arrow represents money, and 3 weeks is effort only.&quot;,&quot;The arrow is a milestone and each circle is a three-week activity.&quot;,&quot;The number beside the arrow is necessarily the activity’s cost.&quot;,&quot;Circles represent events, the arrow represents an activity, and 3 weeks is its duration.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;В показанной нотации PERT события находятся в узлах, а работа — на стрелке. Время указано рядом со стрелкой.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-25&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Burst points and sinks&quot;,&quot;pages&quot;:[17],&quot;question&quot;:&quot;Which description correctly distinguishes a burst point from a sink?&quot;,&quot;options&quot;:[&quot;A burst point has only incoming activities; a sink has only outgoing activities.&quot;,&quot;A burst point has outgoing activities branching from an event; a sink has incoming activities converging at an event.&quot;,&quot;Both mean an activity that must repeat until a test passes.&quot;,&quot;Both mean the total monetary cost of a network.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Burst point — разветвление исходящих работ. Sink — слияние входящих работ в событии.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-26&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Bar chart to PERT conversion&quot;,&quot;pages&quot;:[18],&quot;question&quot;:&quot;What information must be preserved or added when converting the bar/milestone representation in Figure 5 into a PERT network?&quot;,&quot;options&quot;:[&quot;Only the visual length of bars, with all dependencies removed.&quot;,&quot;Only the names of managers, with all dates removed.&quot;,&quot;An assumption that every activity must run sequentially.&quot;,&quot;Activity durations and the logical links that show which events and activities depend on others.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;PERT показывает зависимости и длительности. Параллельные полосы сами по себе не заменяют явную логику предшествования.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-27&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Constructing a network&quot;,&quot;pages&quot;:[20],&quot;question&quot;:&quot;Which three questions does the lecture recommend answering before converting a large project into a PERT network?&quot;,&quot;options&quot;:[&quot;What immediately precedes each job, what immediately follows it, and which jobs can run concurrently?&quot;,&quot;Who designed the logo, who chose the room, and who printed the report?&quot;,&quot;What is the total cost, what is the exchange rate, and what is the tax rate?&quot;,&quot;Which job is longest, which is cheapest, and which can be hidden?&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Для построения сети нужно установить непосредственных предшественников, последователей и возможную параллельность.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-28&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Reading a predecessor table&quot;,&quot;pages&quot;:[19],&quot;question&quot;:&quot;In the lecture’s sequence-of-events table, H has predecessors D and F, while K has predecessors G and J. Which statement is correct?&quot;,&quot;options&quot;:[&quot;H can start after either D or F, whichever finishes first.&quot;,&quot;H must wait for both D and F; K must wait for both G and J.&quot;,&quot;K must wait only for G because it is listed first.&quot;,&quot;H and K have no predecessors because each has more than one listed.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Перечисленные предшественники образуют условие «и»: начало возможно после завершения всех обязательных предшествующих работ.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-29&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Lecture network: critical path&quot;,&quot;pages&quot;:[19,23],&quot;question&quot;:&quot;Use the lecture network below. Durations are in weeks, all dependencies are finish-to-start with no lag, and the project starts at time 0. Data (activity: duration; immediate predecessors): A:1;none. B:5;A. C:2;A. D:2;B. E:2;B. F:2;C. G:3;C. H:2;D,F. I:3;H. J:3;E,I. K:2;G,J. Find the critical path and project duration.&quot;,&quot;answer&quot;:&quot;Critical path: A–B–D–H–I–J–K. Duration: 1+5+2+2+3+3+2 = 18 weeks.&quot;,&quot;explanation_ru&quot;:&quot;Это числа из таблицы и схемы лекции, проверенные по изображениям. Ветвь через B и D задерживает H до недели 8. Далее H, I, J и K дают окончание на неделе 18.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-30&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Lecture network: merge timing&quot;,&quot;pages&quot;:[19,23],&quot;question&quot;:&quot;Use this lecture-network fragment, starting at time 0 with finish-to-start links and no lag: A lasts 1 week; B follows A and lasts 5; C follows A and lasts 2; D follows B and lasts 2; F follows C and lasts 2; H follows both D and F and lasts 2. Calculate EF(D), EF(F), ES(H) and EF(H).&quot;,&quot;answer&quot;:&quot;EF(D)=8; EF(F)=5; ES(H)=max(8,5)=8; EF(H)=10 weeks.&quot;,&quot;explanation_ru&quot;:&quot;При слиянии ветвей следующая работа ждет обе ветви. Нельзя брать минимум или сумму моментов их завершения.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-31&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Critical-path control&quot;,&quot;pages&quot;:[21],&quot;question&quot;:&quot;A critical-path activity slips by 2 days. Under what condition does the lecture allow the original project end date to be preserved?&quot;,&quot;options&quot;:[&quot;A noncritical activity is given a different name.&quot;,&quot;The slippage is ignored because critical activities have unlimited slack.&quot;,&quot;The project budget is increased without any schedule change.&quot;,&quot;The 2-day slippage is recovered in downstream activities on the critical path.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;На критическом пути нет временного резерва. Задержка переносит конец проекта, если ее не компенсировать далее по этому пути.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-32&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Using the critical path for improvement&quot;,&quot;pages&quot;:[15,21],&quot;question&quot;:&quot;A network has two independent start-to-finish paths of 12 and 9 days. If only the 9-day path is shortened to 7 days, what is the project duration? This is a practice example, not lecture data.&quot;,&quot;options&quot;:[&quot;7 days, because the shortest path determines completion.&quot;,&quot;19 days, because all path lengths must be added.&quot;,&quot;12 days, because the longest path is unchanged.&quot;,&quot;10 days, because the path lengths must be averaged.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Сокращение некритического пути само по себе не изменяет длительность проекта. Для сокращения срока нужно воздействовать на ограничивающий путь.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-33&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;GERT versus PERT&quot;,&quot;pages&quot;:[24],&quot;question&quot;:&quot;A test may need to repeat after failure, and its result may select different next steps or final outcomes. Which technique does the lecture recommend for representing this more easily?&quot;,&quot;options&quot;:[&quot;A simple PERT network, because the lecture says it naturally handles all loops.&quot;,&quot;GERT, because it allows looping, branching and multiple project end results.&quot;,&quot;A budget table, because dependencies are irrelevant.&quot;,&quot;A charter signature, because it replaces testing logic.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;В лекции преимущество GERT связано с повторениями, условными ветвями и несколькими возможными результатами проекта.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-34&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Mandatory dependencies&quot;,&quot;pages&quot;:[25],&quot;question&quot;:&quot;Putting up a roof depends on first erecting the walls. How does the lecture classify this dependency?&quot;,&quot;options&quot;:[&quot;Discretionary dependency, or soft logic.&quot;,&quot;Mandatory dependency, or hard logic.&quot;,&quot;A forecast rather than a dependency.&quot;,&quot;A standard rather than a dependency.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Mandatory/hard logic означает неизменяемую технологическую зависимость. Пример стен и крыши дан в лекции.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-35&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Discretionary dependencies&quot;,&quot;pages&quot;:[25],&quot;question&quot;:&quot;A manager decides to wait for the complete bill of materials before starting procurement, although procurement could start earlier. What type of dependency is this?&quot;,&quot;options&quot;:[&quot;Mandatory dependency that cannot vary between projects.&quot;,&quot;External dependency caused only by a customer deadline.&quot;,&quot;A zero-duration milestone rather than a dependency.&quot;,&quot;Discretionary dependency, or soft logic.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Такой порядок выбирается руководителем или меняется между проектами. Полный bill of materials не всегда обязателен до начала закупок.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-36&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;External dependencies&quot;,&quot;pages&quot;:[25],&quot;question&quot;:&quot;A contractor’s activity lies on the project’s critical path and is beyond the project manager’s direct control. Which type of dependency does this illustrate?&quot;,&quot;options&quot;:[&quot;Discretionary dependency solely within the project manager’s control.&quot;,&quot;An event duration of zero in every case.&quot;,&quot;A policy that removes the need for scheduling.&quot;,&quot;External dependency.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;External dependencies могут находиться вне контроля менеджера, например работы подрядчиков на критическом пути.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-37&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Dummy activity logic&quot;,&quot;pages&quot;:[26],&quot;question&quot;:&quot;Figure 7 has parallel activities A and B from the same start. A ends at the start of D; B ends at the start of C. A dummy arrow goes from the end of B to the end of A. Which dependencies does the dummy express?&quot;,&quot;options&quot;:[&quot;D requires both A and B, while C requires B but not A.&quot;,&quot;C requires both A and B, while D requires only A.&quot;,&quot;A requires D, while B requires C.&quot;,&quot;D can begin before both A and B, because the connecting arrow is dashed.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Направление фиктивной стрелки добавляет завершение B к условиям начала D. Для C дополнительной зависимости от A нет.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-38&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Event timing and slack&quot;,&quot;pages&quot;:[27],&quot;question&quot;:&quot;Which definitions and formula match the lecture’s event-slack notation?&quot;,&quot;options&quot;:[&quot;TE is the latest time, TL is the earliest time, and slack = TL + TE.&quot;,&quot;TE is the earliest expected event time, TL is the latest event time without extending project completion, and slack = TL − TE.&quot;,&quot;TE is the activity cost, TL is its budget, and slack = TE/TL.&quot;,&quot;TE and TL are both activity durations and slack is their product.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Резерв события равен разнице между допустимым поздним и ожидаемым ранним сроком.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-39&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Event slack in Figure 8&quot;,&quot;pages&quot;:[27,28],&quot;question&quot;:&quot;Figure 8 gives event 4 an earliest time TE=6 and a latest time TL=9. Calculate its slack and explain the result in the network’s time units.&quot;,&quot;answer&quot;:&quot;Slack = 9−6 = 3 time units. Event 4 can occur up to 3 time units later than its earliest time without extending the project completion date.&quot;,&quot;explanation_ru&quot;:&quot;Это резерв именно события. Нельзя интерпретировать число 3 как стоимость или длительность любой произвольной работы.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-40&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Figure 8: path analysis&quot;,&quot;pages&quot;:[28,29],&quot;question&quot;:&quot;Use the verified network from Figure 8. Activity arcs and durations are: 1→2:3; 1→3:2; 2→4:3; 2→5:7; 3→5:5; 4→6:6; 5→6:5. Start event 1 at time 0. Calculate the project duration and critical path. Also calculate TE, TL and slack for event 3, using project completion at the earliest possible time.&quot;,&quot;answer&quot;:&quot;Project duration=15. Critical path=1→2→5→6 (3+7+5). Event 3: TE=2; TL=5; slack=3. Other full paths have lengths 12 and 12.&quot;,&quot;explanation_ru&quot;:&quot;Прямой проход дает TE(5)=max(3+7,2+5)=10 и TE(6)=max(6+6,10+5)=15. Обратный проход дает TL(3)=10−5=5; резерв 5−2=3.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-41&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;ES, EF, LS and LF notation&quot;,&quot;pages&quot;:[30,33],&quot;question&quot;:&quot;Figure 11 labels activity C as C (8,10) above the arrow and 2 (15,17) below it. What is the correct interpretation?&quot;,&quot;options&quot;:[&quot;ES=15, EF=17, duration=8, LS=2 and LF=10.&quot;,&quot;ES=2, EF=8, duration=15, LS=10 and LF=17.&quot;,&quot;ES=8, EF=10, duration=2, LS=15 and LF=17.&quot;,&quot;The four time values are all different activity costs.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Подписи рисунка показывают ранние сроки сверху, поздние снизу, а число 2 — длительность работы.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-42&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Activity slack from early and late times&quot;,&quot;pages&quot;:[30,33],&quot;question&quot;:&quot;Using the lecture’s activity C, ES=8, EF=10, LS=15, LF=17 and duration=2. How much can its start be delayed from ES without exceeding LS, and what calculation using finish times gives the same result?&quot;,&quot;answer&quot;:&quot;7 time units. LS−ES=15−8=7; equivalently LF−EF=17−10=7.&quot;,&quot;explanation_ru&quot;:&quot;Резерв равен разнице соответствующих поздних и ранних сроков. Длительность работы 2 не равна ее резерву 7.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-43&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Forward pass at a merge&quot;,&quot;pages&quot;:[20,28,30],&quot;question&quot;:&quot;Practice example: activity X has three finish-to-start predecessors with EF values 6, 9 and 7 days. There is no lag and X lasts 4 days. What are ES(X) and EF(X)?&quot;,&quot;options&quot;:[&quot;ES=9 and EF=13.&quot;,&quot;ES=6 and EF=10.&quot;,&quot;ES=22 and EF=26.&quot;,&quot;ES=7 and EF=11.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Следующая работа ждет самого позднего предшественника: ES=max(6,9,7)=9; EF=9+4=13. Числа придуманы для тренировки.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-44&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Backward pass at a branch&quot;,&quot;pages&quot;:[28,30,33],&quot;question&quot;:&quot;Practice example: activity X lasts 3 days and must finish before either of its two successors can start. The successors’ LS values are 10 and 14. There is no lag. What are LF(X) and LS(X)?&quot;,&quot;options&quot;:[&quot;LF=14 and LS=11.&quot;,&quot;LF=24 and LS=21.&quot;,&quot;LF=7 and LS=4.&quot;,&quot;LF=10 and LS=7.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Чтобы не нарушить ни одну последующую работу, X должна закончиться к min(10,14)=10; LS=10−3=7. Это учебные числа.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-45&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Complete practice network&quot;,&quot;pages&quot;:[20,27,28,30,33],&quot;question&quot;:&quot;Practice network, not lecture data. Start at time 0; all links are finish-to-start with zero lag. Activities (duration in days; predecessors): A(2;none), B(4;A), C(3;A), D(5;B,C), E(2;C), F(1;D,E). Find project duration, critical path, and ES/EF/LS/LF/slack for C and E. Use the earliest project finish as the required finish.&quot;,&quot;answer&quot;:&quot;Duration=12 days; critical path=A–B–D–F. C: ES=2, EF=5, LS=3, LF=6, slack=1. E: ES=5, EF=7, LS=9, LF=11, slack=4.&quot;,&quot;explanation_ru&quot;:&quot;Прямой проход: A 0–2, B 2–6, C 2–5, D 6–11, E 5–7, F 11–12. Обратный проход: LS(F)=11, LS(D)=6, LS(E)=9, LF(C)=min(6,9)=6. Резервы C=3−2=1 и E=9−5=4.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-46&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Figure 12: a second lecture network&quot;,&quot;pages&quot;:[34],&quot;question&quot;:&quot;Use the verified activity data from Figure 12. Start at time 0, with finish-to-start links and no lag: A(6;none), B(9;A), C(5;A), D(6;A), E(3;B), F(7;B), G(2;D), H(4;D), I(3;C,E,G). The project finishes after F, H and I. Find the project duration, critical path and activity C’s slack.&quot;,&quot;answer&quot;:&quot;Duration=22 time units; critical path=A–B–F. Activity C has ES=6, EF=11, LS=14, LF=19, so slack=8.&quot;,&quot;explanation_ru&quot;:&quot;Верхняя ветвь A–B–F дает 6+9+7=22. I может начаться в 18 и закончиться в 21, но его позднее начало — 19. Поэтому LF(C)=19, LS(C)=14, резерв 8.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-47&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Time-phased comparisons&quot;,&quot;pages&quot;:[29],&quot;question&quot;:&quot;What does Figure 9 combine to support comparison and control?&quot;,&quot;options&quot;:[&quot;Only a list of completed invoices without a time axis.&quot;,&quot;Predicted versus actual manpower, predicted versus actual total expenditures, and a time-phased network showing activities, critical path and slack.&quot;,&quot;Only a charter signature and a scope statement.&quot;,&quot;Only the names of activities without resource or schedule information.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;На рисунке три связанных вида: трудовые ресурсы, накопленные расходы и сеть во времени с резервами. Они помогают сравнивать план с исполнением.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-48&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;PERT control output&quot;,&quot;pages&quot;:[32],&quot;question&quot;:&quot;Which information appears in the lecture’s PERT control-output table?&quot;,&quot;options&quot;:[&quot;Only activity names and employee home addresses.&quot;,&quot;Only the final project price and profit margin.&quot;,&quot;Event number; earliest and latest expected times and their variances; slack; original schedule; probability of meeting the schedule.&quot;,&quot;Only the project manager’s signature and the sponsor’s name.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Таблица включает временные оценки, их дисперсии, резерв, исходный график и вероятность выполнения графика. Формулы вероятности на этом слайде не приведены.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-49&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Negative slack meaning&quot;,&quot;pages&quot;:[35,36],&quot;question&quot;:&quot;Why can a backward pass produce negative slack?&quot;,&quot;options&quot;:[&quot;The forward-pass completion extends beyond the customer’s required finish, but the backward pass still starts from that required date.&quot;,&quot;The backward pass always starts after the forecast finish.&quot;,&quot;Negative slack means there are no dependencies in the project.&quot;,&quot;The customer’s deadline is later than all activity finish dates in every case.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Отрицательный резерв показывает, что текущий расчетный план не укладывается в требуемый срок клиента.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-50&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Causes of negative slack&quot;,&quot;pages&quot;:[35],&quot;question&quot;:&quot;Which set contains causes of negative slack listed in the lecture?&quot;,&quot;options&quot;:[&quot;Perfectly realistic dates and all required resources always available early.&quot;,&quot;An optimistic unrealistic plan or deadline, activity slippage, insufficient skill levels, or required resources becoming available too late.&quot;,&quot;Deleting every dependency while retaining the same network logic.&quot;,&quot;Changing chart colors without changing any schedule information.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;В лекции перечислены нереалистичный исходный план, нереалистичный срок клиента, задержки работ, недостаточная квалификация и поздняя доступность ресурсов.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-51&quot;,&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Positive and negative slack examples&quot;,&quot;pages&quot;:[34,35],&quot;question&quot;:&quot;At the top of Figure 12, situation a has early times [20,26] and late times [24,30]; situation b has early times [30,36] and late times [25,31]. Calculate the slack in each case and explain the difference.&quot;,&quot;answer&quot;:&quot;Situation a: 24−20=30−26=+4. Situation b: 25−30=31−36=−5. Situation a allows 4 time units of delay; situation b needs 5 time units of schedule recovery to meet the late-time requirement.&quot;,&quot;explanation_ru&quot;:&quot;Положительный резерв допускает перенос в пределах 4 единиц. Отрицательный резерв −5 означает нехватку времени относительно требуемого графика, а не дополнительную свободу.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-52&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Formula discrepancy check&quot;,&quot;pages&quot;:[33,37],&quot;question&quot;:&quot;Page 37 prints “maximum float = latest finish + earliest start − duration.” Check that expression against activity C on page 33: ES=8, EF=10, LS=15, LF=17, duration=2. What conflict appears, and which expression agrees with the early/late time differences?&quot;,&quot;answer&quot;:&quot;The printed expression gives 17+8−2=23, while LS−ES=15−8=7 and LF−EF=17−10=7. LF−ES−duration=17−8−2=7 agrees with those differences. Treat the plus sign on page 37 as a source discrepancy to clarify, not as a reliable total-float calculation.&quot;,&quot;explanation_ru&quot;:&quot;На слайде 37 действительно напечатан плюс перед ES. Он противоречит проверке на примере слайда 33. Для расчета общего резерва согласованы LS−ES=LF−EF=LF−ES−duration; различие в исходнике следует уточнить у преподавателя.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-53&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Resource leveling&quot;,&quot;pages&quot;:[38],&quot;question&quot;:&quot;What is resource leveling intended to do, and what practical trade-off does the lecture identify?&quot;,&quot;options&quot;:[&quot;Smooth manpower peaks and valleys; ideally keep the end date, although the finish may move later and additional costs may occur.&quot;,&quot;Maximize peaks and valleys while always guaranteeing an earlier finish.&quot;,&quot;Ignore time-phased resource needs and consider only total budget.&quot;,&quot;Remove all skill constraints by renaming activities.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Resource leveling сглаживает потребность в ресурсах по периодам. В идеале срок сохраняется, но лекция предупреждает о возможном удлинении и дополнительных затратах.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-54&quot;,&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Resource allocation&quot;,&quot;pages&quot;:[38],&quot;question&quot;:&quot;What is the aim of resource allocation, also called resource-limited planning?&quot;,&quot;options&quot;:[&quot;Assume unlimited resources and ignore the critical path.&quot;,&quot;Make every resource’s workload identical regardless of dependencies.&quot;,&quot;Guarantee that all employees can perform every type of activity.&quot;,&quot;Find the shortest feasible critical path or schedule given available or fixed resources.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Resource allocation ищет кратчайший выполнимый график при заданных ресурсах. Ограниченность квалификации работников может затруднять перераспределение.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;lecture&quot;:2},{&quot;id&quot;:&quot;L2-55&quot;,&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Selecting a replanning approach&quot;,&quot;pages&quot;:[38],&quot;question&quot;:&quot;Which pair matches (1) smoothing manpower fluctuations and (2) finding the shortest schedule with a fixed team and different technical skills?&quot;,&quot;answer&quot;:&quot;(1) Resource leveling. (2) Resource allocation (resource-limited planning), considering staff qualifications.&quot;,&quot;explanation_ru&quot;:&quot;Первая задача — сглаживание загрузки. Вторая — поиск срока при ограниченных ресурсах, причем сотрудники не обязательно способны выполнять любые работы.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;lecture&quot;:2},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Disciplined pricing&quot;,&quot;pages&quot;:[2],&quot;question&quot;:&quot;Why does the lecture recommend a disciplined pricing process even when competitors may have the same customer-budget and competitive-price information?&quot;,&quot;options&quot;:[&quot;It guarantees that competitors will submit higher prices.&quot;,&quot;It removes the need for managerial judgment.&quot;,&quot;It produces a rational recommendation and documents factors and assumptions for later comparison and learning.&quot;,&quot;It makes contractual requirements irrelevant.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Дисциплина помогает обосновать цену и сохранить факторы и допущения для последующего анализа. Одинаковая доступность информации не гарантирует одинаковое качество решений.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-01&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Estimates and CERs&quot;,&quot;pages&quot;:[3],&quot;question&quot;:&quot;Which statement best reflects the lecture&#x27;s view of estimates and cost estimating relationships (CERs)?&quot;,&quot;options&quot;:[&quot;Estimates should use the best available information, a CER or a cost model; CERs are generally outputs of cost models.&quot;,&quot;Estimates are mainly blind luck, while cost models only record actual costs.&quot;,&quot;CERs replace the need to consider any project information.&quot;,&quot;A CER must always relate cost to a physical characteristic.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Оценка — обдуманное решение, основанное на доступной информации, CER или модели затрат. CER обычно являются результатом моделей, а не только связями с физическими характеристиками.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-02&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Types of CERs&quot;,&quot;pages&quot;:[3],&quot;question&quot;:&quot;Name the four types of CER examples listed in Lecture 3. Include the example associated with cost-quantity relationships.&quot;,&quot;answer&quot;:&quot;(1) Mathematical equations based on regression analysis; (2) cost-quantity relationships, such as learning curves; (3) cost-cost relationships; (4) cost-noncost relationships based on physical characteristics, technical parameters or performance characteristics.&quot;,&quot;explanation_ru&quot;:&quot;Нужно различать все четыре вида связей. Кривые обучения приведены как пример связи «затраты–количество».&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-03&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Acquisition objectives&quot;,&quot;pages&quot;:[4],&quot;question&quot;:&quot;Which pairing correctly distinguishes the two acquisition types?&quot;,&quot;options&quot;:[&quot;Type I seeks repeat business; Type II must always maximize immediate profit.&quot;,&quot;Both types apply only to one-of-a-kind programs with no follow-on business.&quot;,&quot;Type I accepts any loss to enter a market; Type II avoids new customers.&quot;,&quot;Type I aims to win and execute a one-off program profitably and satisfactorily; Type II may prioritize a foothold in a new market or customer community over immediate profit.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Type I ориентирован на прибыльное выполнение разовой программы по контракту. Type II может ставить последующий бизнес и вход на рынок выше прибыли по первому заказу.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-04&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Type I pricing sequence&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;Outline the Type I pricing strategy in Table 1, from developing the baseline to the final bidding decision.&quot;,&quot;answer&quot;:&quot;Develop a cost model and estimating guidelines; design a minimum-cost baseline meeting minimum customer requirements; estimate those requirements realistically; scrub unnecessary costs; determine a realistic minimum cost and obtain performing-organization commitments; adjust for risks; add desired margins to determine price; compare that price with the customer budget and competitive cost information; bid only if the price is within the competitive range.&quot;,&quot;explanation_ru&quot;:&quot;Порядок связывает реалистичную минимальную стоимость, риски, маржу и проверку конкурентоспособности. «Scrub the baseline» означает убрать ненужные затраты.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-05&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Type I bid condition&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;A Type I team has estimated minimum cost, adjusted for risks and added its desired margin. According to Table 1, what should govern the final decision to bid?&quot;,&quot;options&quot;:[&quot;The fact that the estimate took many weeks to prepare.&quot;,&quot;Whether the resulting price is within the competitive range after comparison with customer budget and competitive information.&quot;,&quot;Whether follow-on contracts can later cover a planned loss.&quot;,&quot;Whether the price is below cost regardless of customer requirements.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Для Type I в таблице прямо указано: подавать предложение только при цене в конкурентном диапазоне.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-06&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Type II baseline&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;Which sequence describes the early Type II strategy in Table 1?&quot;,&quot;options&quot;:[&quot;Ignore requirements, cut all innovation and postpone cost estimation.&quot;,&quot;Add maximum margin first, then decide what the customer needs.&quot;,&quot;Design a requirements-compliant baseline with innovative features and minimum risks; estimate realistically; remove unnecessary costs; establish realistic minimum cost and organizational commitments.&quot;,&quot;Use minimum requirements only and automatically reject any innovative feature.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Type II сочетает соответствие требованиям, инновационные особенности и минимальные риски. Затем следуют реалистичная оценка, исключение лишних затрат и обязательства исполнителей.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-07&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Type II should-cost and margin&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;After establishing realistic minimum cost for a Type II acquisition, which approach does Table 1 describe?&quot;,&quot;options&quot;:[&quot;Determine risk-adjusted &#x27;should-cost&#x27;, compare it with the customer budget and most likely winning price, then assess the required gross margin, which may be negative.&quot;,&quot;Always add a positive margin before looking at the market.&quot;,&quot;Exclude risk adjustments because the objective is market entry.&quot;,&quot;Bid only if the price equals the maximum customer budget.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Для Type II определяется should-cost с рисками, затем оценивается вероятная победная цена и допустимость маржи с учётом стремления выиграть. Маржа может быть отрицательной.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-08&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Type II below-cost bids&quot;,&quot;pages&quot;:[5],&quot;question&quot;:&quot;For a Type II bid below cost, what additional explanation may be needed to maintain cost credibility?&quot;,&quot;options&quot;:[&quot;A promise that the customer will pay all future losses without agreement.&quot;,&quot;A statement that no resources are required until the next contract.&quot;,&quot;A claim that below-cost bids never need explanation.&quot;,&quot;A clear resource and funding explanation, for example funding from company profits or sharing of related activities; the bid may be at or below the most likely winning price depending on the desire to win.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Таблица требует объяснить источник дополнительного финансирования при цене ниже стоимости и дать ясную картину ресурсов. Возможные источники — прибыль компании или совместное использование связанных работ.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-09&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Estimating information&quot;,&quot;pages&quot;:[6],&quot;question&quot;:&quot;List the six categories of information that the lecture says should be collected before estimating begins.&quot;,&quot;answer&quot;:&quot;Recent experience in similar work; professional and reference material; market and industry surveys; knowledge of operations and processes; estimating software and databases if available; interviews with subject matter experts.&quot;,&quot;explanation_ru&quot;:&quot;Эти шесть источников собирают до начала оценки. Они объединяют опыт, справочные и рыночные данные, знание процессов, инструменты и экспертизу.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-10&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Parametric estimating&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;According to Figure 1, which row describes parametric estimating?&quot;,&quot;options&quot;:[&quot;Budget; bottom-up; -10% to +25%; months.&quot;,&quot;Rough order of magnitude (ROM); top-down; -25% to +75%; days.&quot;,&quot;Definitive; top-down; ±5%; weeks.&quot;,&quot;ROM; bottom-up; -5% to +10%; months.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;В Fig. 1 parametric связан с ROM (rough order of magnitude), подходом top-down, диапазоном от −25% до +75% и подготовкой за дни.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-11&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Analogy estimating&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;According to Figure 1, which row describes analogy estimating?&quot;,&quot;options&quot;:[&quot;ROM; bottom-up; -25% to +75%; days.&quot;,&quot;Definitive; bottom-up; -5% to +10%; months.&quot;,&quot;Budget; top-down; -10% to +25%; weeks.&quot;,&quot;Capital cost; top-down; ±10–15%; days.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;В Fig. 1 analogy соответствует budget estimate, top-down, −10%…+25% и неделям подготовки.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-12&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Engineering estimating&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;Which statement matches engineering (grass-roots) estimating in Figure 1?&quot;,&quot;options&quot;:[&quot;It is a definitive, bottom-up estimate with accuracy -5% to +10%, typically taking months to prepare.&quot;,&quot;It is a budget, top-down estimate with accuracy -10% to +25%, typically taking weeks.&quot;,&quot;It is always quicker and less detailed than parametric estimating.&quot;,&quot;It is a ROM estimate with accuracy -25% to +75%, typically taking days.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Engineering (grass roots) в Fig. 1 — детальная definitive-оценка снизу вверх, подготовка месяцами, диапазон −5%…+10%.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-13&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;ROM accuracy calculation&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;Exercise example: Apply the Figure 1 parametric/ROM range of -25% to +75% to a base estimate of KZT 2,000,000. What are the lower and upper amounts?&quot;,&quot;answer&quot;:&quot;Lower: 2,000,000 × 0.75 = KZT 1,500,000. Upper: 2,000,000 × 1.75 = KZT 3,500,000.&quot;,&quot;explanation_ru&quot;:&quot;Проценты применяются к базовой оценке: нижняя граница 75%, верхняя 175%. Это учебный числовой пример, не данные лекции.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-14&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Estimating manual tools&quot;,&quot;pages&quot;:[8],&quot;question&quot;:&quot;Which complete set appears under &#x27;Major Estimating Tools&#x27; in the sample estimating-manual contents?&quot;,&quot;options&quot;:[&quot;Risk registers, customer invoices, marketing slogans and employment contracts.&quot;,&quot;Only interviews and management intuition.&quot;,&quot;Only the final definitive-estimate procedure.&quot;,&quot;Cataloged equipment costs, an automated investment data system, an automated estimate system, and computerized methods and procedures.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Fig. 2 перечисляет четыре major estimating tools: каталог стоимости оборудования, automated investment data system, automated estimate system и компьютеризированные методы/процедуры.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-15&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Estimating manual structure&quot;,&quot;pages&quot;:[8],&quot;question&quot;:&quot;Besides Major Estimating Tools, what does the sample estimating manual cover? Identify the introduction, estimate-class content, data-comparison item and presentation procedures.&quot;,&quot;answer&quot;:&quot;Introduction: purpose and types of estimates. Classes: definitive, capital cost, appropriation, feasibility and order of magnitude, plus charts on estimate specifications, quantity and pricing guidelines. Data Required: a chart comparing data needed to prepare the classes of estimates. Presentation Specifications: a general estimate procedure plus procedures for definitive, capital cost, appropriation and feasibility estimates.&quot;,&quot;explanation_ru&quot;:&quot;Fig. 2 показывает не только инструменты: руководство описывает назначение оценок, классы и указания по количеству/ценам, необходимые данные и порядок представления оценок.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-16&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Estimate classes I and II&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;Which pairing is correct in Figure 3 (Classes of Estimates)?&quot;,&quot;options&quot;:[&quot;Class I: feasibility, ±25–35%; Class II: definitive, ±5%.&quot;,&quot;Class I: definitive, ±5%; Class II: capital cost, ±10–15%.&quot;,&quot;Class I: definitive, -5% to +10%; Class II: budget, -10% to +25%.&quot;,&quot;Class I: appropriation, ±20–25%; Class II: order of magnitude, &gt;±35%.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Именно в Fig. 3 класс I — definitive ±5%, класс II — capital cost ±10–15%. Не следует переносить сюда диапазоны Fig. 1.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-17&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Estimate classes III and IV&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;Which pairing is correct in Figure 3?&quot;,&quot;options&quot;:[&quot;Class III: appropriation with some capital cost, ±15–20%; Class IV: appropriation, ±20–25%.&quot;,&quot;Class III: capital cost, ±10–15%; Class IV: definitive, ±5%.&quot;,&quot;Class III: feasibility, ±25–35%; Class IV: order of magnitude, &gt;±35%.&quot;,&quot;Class III: appropriation, ±20–25%; Class IV: appropriation with some capital cost, ±15–20%.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Class III — appropriation with some capital cost с ±15–20%; Class IV — appropriation с ±20–25%.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-18&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Estimate classes V and VI&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;Which pairing is correct in Figure 3?&quot;,&quot;options&quot;:[&quot;Class V: definitive, ±5%; Class VI: capital cost, ±10–15%.&quot;,&quot;Class V: appropriation, ±20–25%; Class VI: feasibility, ±25–35%.&quot;,&quot;Class V: order of magnitude, &gt;±35%; Class VI: feasibility, ±25–35%.&quot;,&quot;Class V: feasibility, ±25–35%; Class VI: order of magnitude, &gt;±35%.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Последние классы Fig. 3: V — feasibility ±25–35%; VI — order of magnitude, записанный диапазон &gt;±35%.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-19&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Accuracy-table distinction&quot;,&quot;pages&quot;:[7,9],&quot;question&quot;:&quot;The word &#x27;definitive&#x27; appears in both Figure 1 and Figure 3. State the accuracy given in each figure, keeping the two classifications separate.&quot;,&quot;answer&quot;:&quot;Figure 1: engineering (grass-roots), generic type definitive, -5% to +10%. Figure 3: Class I definitive, ±5%.&quot;,&quot;explanation_ru&quot;:&quot;В лекции две разные таблицы дают разные диапазоны для слова definitive. Ответ должен указывать номер таблицы/рисунка, а не объявлять один диапазон универсальным.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-20&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Life-cycle estimating&quot;,&quot;pages&quot;:[10],&quot;question&quot;:&quot;Which life-cycle mapping matches the lecture for in-house projects?&quot;,&quot;options&quot;:[&quot;Conceptual: detailed work; planning: final audit; main: feasibility; termination: no further estimates.&quot;,&quot;Conceptual: full funding on final design; planning: minimum-scope feasibility; main: risk closure; termination: cancel all variances.&quot;,&quot;Conceptual: venture guidance/feasibility with minimum scope; planning: partial/full funding authorization from preliminary design and scope; main: detailed work; termination: reestimate for major scope changes or variances beyond authorization.&quot;,&quot;Every stage uses the same estimate regardless of purpose, and competitive bids need not match customer requirements.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Для внутренних проектов тип оценки меняется по жизненному циклу. При конкурсной заявке он должен соответствовать требованиям заказчика.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-21&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Pricing process and control tools&quot;,&quot;pages&quot;:[12],&quot;question&quot;:&quot;How does pricing-out integrate functional units into project control?&quot;,&quot;options&quot;:[&quot;Functional units independently set a final selling price without reference to the WBS.&quot;,&quot;The program office develops the WBS and activity schedules with functional input; pricing their activities over the scheduled period provides total program costs, the third management tool.&quot;,&quot;Costs replace the WBS and eliminate the need for schedules.&quot;,&quot;Only the customer may suggest changes to the WBS during pricing.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;WBS и расписание разрабатываются программным офисом с участием функций. Оценка стоимости работ во времени даёт третий инструмент — затраты программы; функции могут обсуждать корректировки WBS и расписания.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-22&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Pricing kickoff meeting&quot;,&quot;pages&quot;:[13],&quot;question&quot;:&quot;After the WBS and activity schedules are established, what should the pricing kickoff meeting achieve?&quot;,&quot;options&quot;:[&quot;Bring together all pricing/labor-costing representatives, explain the WBS and responsibilities, and resolve overlaps or power struggles among functional managers.&quot;,&quot;Allow only the program manager to see the WBS.&quot;,&quot;Set labor prices without involving organizations that will submit pricing information.&quot;,&quot;Delay defining responsibilities until after the proposal has been submitted.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;На первом совещании необходимы представители всех организаций, подающих оценки. Подробное объяснение WBS проясняет ответственность и устраняет конфликт пересекающихся полномочий.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-23&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;RFP timing and labor justification&quot;,&quot;pages&quot;:[13,14],&quot;question&quot;:&quot;Which statement correctly describes proposal timing and labor-cost justification?&quot;,&quot;options&quot;:[&quot;The functional units can always ignore the proposal manager&#x27;s schedule.&quot;,&quot;Labor justification always takes less time than the original estimate.&quot;,&quot;Every RFP permits labor justification after submission.&quot;,&quot;The RFP deadline indirectly limits pricing time; the proposal manager&#x27;s schedule leaves little flexibility, and labor justification may take longer than estimating, although some urgent proposals allow it later.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Нужен запас времени на набор, редактирование и выпуск предложения. Без исторических норм обоснование труда может занять больше времени, чем первоначальная оценка; возможность позднего обоснования зависит от предложения.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-24&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Maintaining labor standards&quot;,&quot;pages&quot;:[14],&quot;question&quot;:&quot;Who has final responsibility for maintaining adequate standards so that the program office can receive an almost immediate response to a pricing request?&quot;,&quot;options&quot;:[&quot;The customer alone.&quot;,&quot;Lowest pricing-unit supervisors.&quot;,&quot;Only the proposal&#x27;s typists and editors.&quot;,&quot;External competitors.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Лекция возлагает поддержание пригодных норм на руководителей нижнего уровня pricing units.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-25&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Inflated labor-hour requests&quot;,&quot;pages&quot;:[15],&quot;question&quot;:&quot;Why do functional units often overestimate labor hours, according to the lecture?&quot;,&quot;options&quot;:[&quot;They know all projects must use fixed-price contracts.&quot;,&quot;They want to eliminate the WBS.&quot;,&quot;They fear that management will reduce hours while preserving the same scope; management may cut hours because of funding limits or competition.&quot;,&quot;They assume that all work can be completed without resources.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Функциональные подразделения закладывают запас, ожидая сокращений при неизменном объёме. Руководство может сокращать часы из-за бюджета или конкурентной цены.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-26&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Labor distribution conflict&quot;,&quot;pages&quot;:[15],&quot;question&quot;:&quot;Which response best follows the lecture when program and functional managers disagree about reducing labor hours?&quot;,&quot;options&quot;:[&quot;Use program-team members who know departmental labor standards to build trust and make reductions in the company&#x27;s best interests.&quot;,&quot;Exclude everyone with functional experience from the program team.&quot;,&quot;Always preserve the functional department&#x27;s staff regardless of program requirements.&quot;,&quot;Accept the lowest hour total without discussing standards.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Program manager ориентирован на программу, functional manager — на сохранение сотрудников. Знание норм создаёт доверие; поэтому участников команды нередко продвигают из функциональных подразделений.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-27&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Overhead: people-related elements&quot;,&quot;pages&quot;:[16],&quot;question&quot;:&quot;Using Table 2, list its people-related overhead examples, including staff compensation/support, employee benefits and recruitment.&quot;,&quot;answer&quot;:&quot;Clerical; corporate salaries; executive salaries; fringe benefits; group insurance; holiday; payroll taxes; personnel recruitment; retirement plans; sick leave; supervision; vacation.&quot;,&quot;explanation_ru&quot;:&quot;Все перечисленные позиции входят в Table 2 как overhead. Это группировка для повторения; сама лекция даёт общий список без таких подкатегорий.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-28&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Overhead: facilities and operating support&quot;,&quot;pages&quot;:[16],&quot;question&quot;:&quot;Using Table 2, list the overhead examples associated with buildings, facilities, supplies, equipment and logistical support.&quot;,&quot;answer&quot;:&quot;Building maintenance; building rent; cafeteria; depreciation of equipment; moving/storage expenses; office supplies; postage; reproduction facilities; supplies/hand tools; telephone/telegraph facilities; transportation; utilities.&quot;,&quot;explanation_ru&quot;:&quot;В Table 2 эти расходы включены в накладные. Группировка по инфраструктуре сделана только для удобства повторения, а не как новая классификация лекции.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-29&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Overhead: administrative and business support&quot;,&quot;pages&quot;:[16],&quot;question&quot;:&quot;Which complete group contains the remaining administrative/business-support examples listed in Table 2?&quot;,&quot;options&quot;:[&quot;Direct project installation hours, project-specific raw materials and customer profit.&quot;,&quot;Only rent, utilities and building maintenance.&quot;,&quot;Only employee holidays, payroll taxes and sick leave.&quot;,&quot;Clubs/associations, consulting services, corporate auditing expenses, general ledger expenses, new business directors and professional meetings.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Эти шесть позиций также прямо перечислены среди overhead rates. Вместе с двумя предыдущими вопросами покрыт весь список Table 2.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-30&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Materials and support data&quot;,&quot;pages&quot;:[17],&quot;question&quot;:&quot;Which practice matches the lecture&#x27;s requirements for supporting cost data?&quot;,&quot;options&quot;:[&quot;Prepare backup only after pricing, even when the proposal requires it.&quot;,&quot;Develop required backup alongside pricing; keep itemized prices compatible with it; use external quotes and continually updated internal historical data traceable by itemized charge numbers.&quot;,&quot;Use internal historical data but never update them after new projects.&quot;,&quot;Replace vendor quotations with untraceable totals.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Для требуемого backup цены и подтверждения готовят согласованно. Внешние источники — подрядчики/поставщики, внутренние — обновляемая история; нужна прослеживаемость по кодам затрат. Government pricing отмечен как особый случай.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-31&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Supporting-data audits&quot;,&quot;pages&quot;:[18],&quot;question&quot;:&quot;What does the lecture say about audits of sole-source cost proposals?&quot;,&quot;options&quot;:[&quot;They are never allowed before final submission.&quot;,&quot;They always start with the project&#x27;s advertising materials.&quot;,&quot;Supporting data may be the audit&#x27;s starting point and may be audited before the final cost proposal is submitted.&quot;,&quot;They eliminate the need for itemized backup data.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Для sole-source proposals аудит подтверждающих данных до подачи окончательного ценового предложения назван обычной возможностью.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-32&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Contract type and audit access&quot;,&quot;pages&quot;:[18],&quot;question&quot;:&quot;Which comparison matches the lecture&#x27;s qualified description of customer audit access?&quot;,&quot;options&quot;:[&quot;On fixed-price work the customer may not have the right to audit the books; on cost-reimbursable work costs are usually open and exact costs are compared with backup.&quot;,&quot;Fixed-price contracts always make every cost an open book, while cost-reimbursable contracts forbid audits.&quot;,&quot;Both contract types always forbid supporting data.&quot;,&quot;Contract type never affects the need for supporting data.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Формулировки лекции условные: fixed-price — заказчик может не иметь права на аудит; cost-reimbursable — обычно открытые затраты и сравнение с подтверждениями. Нельзя превращать это в безусловное правило для всех контрактов.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-33&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Low-bidder dilemma&quot;,&quot;pages&quot;:[19],&quot;question&quot;:&quot;Why can &#x27;submit the lowest possible price&#x27; be a poor proposal strategy?&quot;,&quot;options&quot;:[&quot;A low price automatically guarantees profitable execution.&quot;,&quot;Winning is the only company objective after proposal submission.&quot;,&quot;Market penetration and product development never influence pricing.&quot;,&quot;Winning is only the beginning; short- and long-term goals such as profit, market penetration and new-product development may not fit a low-price strategy.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Цена влияет на победу, но компания должна учитывать дальнейшее выполнение и стратегические цели. Лекция подчёркивает неопределённость выбора победной цены.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-34&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Average pricing and average charging&quot;,&quot;pages&quot;:[20],&quot;question&quot;:&quot;Work is estimated and charged at the department&#x27;s average salary regardless of who performs it. What incentive does the lecture identify?&quot;,&quot;options&quot;:[&quot;Managers prefer the lowest-paid employees because actual salaries are billed.&quot;,&quot;Managers may compete for the highest-salary resources because only average wages are billed to their projects.&quot;,&quot;The project is automatically charged an overrun for using senior staff.&quot;,&quot;The method is the most difficult to administer.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Метод average/average назван самым простым, но он стимулирует руководителей добиваться дорогих специалистов при оплате по средней ставке.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-35&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Average pricing and actual charging&quot;,&quot;pages&quot;:[20],&quot;question&quot;:&quot;A project is estimated at departmental average salary but charged at each worker&#x27;s actual salary. What may happen if only higher-paid staff are used?&quot;,&quot;options&quot;:[&quot;The project cannot experience an overrun because its estimate used averages.&quot;,&quot;The actual rate is automatically reduced to the average.&quot;,&quot;Costs may overrun unless the higher-paid staff perform the work in less time.&quot;,&quot;The workers&#x27; qualifications cease to matter.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;При average/actual более высокая фактическая ставка вызывает перерасход, если выигрыш во времени не компенсирует её.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-36&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Average-versus-actual cost calculation&quot;,&quot;pages&quot;:[20],&quot;question&quot;:&quot;Exercise example: A task is estimated at 100 hours at KZT 5,000 per hour, but assigned staff cost KZT 6,250 per hour. Calculate the original labor budget, the cost overrun if 100 hours are used, and the maximum hours that would keep cost within the original budget.&quot;,&quot;answer&quot;:&quot;Budget = 100 × 5,000 = KZT 500,000. Actual cost at 100 hours = 100 × 6,250 = KZT 625,000; overrun = KZT 125,000. Maximum hours = 500,000 / 6,250 = 80 hours.&quot;,&quot;explanation_ru&quot;:&quot;Чтобы компенсировать более высокую ставку, трудозатраты должны сократиться до 80 часов или меньше. Все числа добавлены как учебный пример.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-37&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Actual pricing and mixed methods&quot;,&quot;pages&quot;:[21],&quot;question&quot;:&quot;Which statement matches the lecture&#x27;s third salary-costing method and its mixed-method example?&quot;,&quot;options&quot;:[&quot;Pricing and billing at the actual salaries of identified staff is ideal if staff can be identified during pricing; a company may use it for the project office and average-based methods for functional employees.&quot;,&quot;Actual/actual costing is impossible even when every worker is already known.&quot;,&quot;The project office must always be priced at departmental average because its members are identified last.&quot;,&quot;A company is prohibited from combining the three methods.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Actual/actual считается идеальным при заранее известных исполнителях. Для проектного офиса людей часто знают раньше, поэтому там применяют третий метод, а для функций — первый или второй.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-38&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Short-duration projects and labor-hour inflation&quot;,&quot;pages&quot;:[21],&quot;question&quot;:&quot;In the lecture&#x27;s average-estimate/actual-charge situation, why might a short-duration project inflate estimated direct labor hours?&quot;,&quot;options&quot;:[&quot;To reduce the customer&#x27;s contractual scope automatically.&quot;,&quot;Because all employees are paid below the departmental average.&quot;,&quot;Because the lecture says inflated hours are the ideal method in every case.&quot;,&quot;Only higher-paid employees may be usable, while a government-required charging approach may force actual salary billing, so hours are inflated to compensate for extra cost.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Лекция описывает такую практику при коротких проектах и высокооплачиваемых доступных исполнителях. Это описание проблемы выбранного метода, а не универсальная рекомендация.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-39&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Buy-in estimating pitfall&quot;,&quot;pages&quot;:[23],&quot;question&quot;:&quot;What is the &#x27;buy-in&#x27; pitfall described as especially serious and often beyond the project manager&#x27;s control?&quot;,&quot;options&quot;:[&quot;Rejecting every project with follow-on opportunities.&quot;,&quot;Underpricing the initial contract on the assumption that later changes or follow-on contracts will provide a financial &#x27;bail-out&#x27;.&quot;,&quot;Using a risk-adjusted should-cost model.&quot;,&quot;Updating internal historical data after each completed project.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;Buy-in опирается на ожидание, что будущие изменения или последующие контракты исправят исходную ситуацию. Их получение не гарантировано.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-40&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Expected bail-out sources&quot;,&quot;pages&quot;:[23],&quot;question&quot;:&quot;List the examples of later changes or contracts on which a buy-in decision may rely in this lecture.&quot;,&quot;answer&quot;:&quot;Spare parts; maintenance; maintenance manuals; equipment surveillance; optional equipment; optional services; scrap factors.&quot;,&quot;explanation_ru&quot;:&quot;Это семь названных источников ожидаемого bail-out. Их перечисление не означает, что такое решение надёжно.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-41&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Scope and schedule estimating pitfalls&quot;,&quot;pages&quot;:[24],&quot;question&quot;:&quot;Which group consists entirely of estimating pitfalls listed in the lecture?&quot;,&quot;options&quot;:[&quot;Clear scope, realistic schedules and an accurate WBS.&quot;,&quot;A detailed statement of work, qualified staff and routine risk review.&quot;,&quot;Misinterpreting the statement of work, omissions or poorly defined scope, a poorly defined or overly optimistic schedule, and an inaccurate WBS.&quot;,&quot;Regular historical-data updates, correctly chosen skill levels and traceable charge numbers.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Ошибки понимания работ, неполный scope, слишком оптимистичное расписание и неточный WBS входят в список estimating pitfalls.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-42&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Resource, risk and rate estimating pitfalls&quot;,&quot;pages&quot;:[24],&quot;question&quot;:&quot;Besides statement-of-work, scope, schedule and WBS errors, identify the other estimating pitfalls listed on page 24.&quot;,&quot;answer&quot;:&quot;Applying improper skill levels to tasks; failing to account for risks; failing to understand or account for cost escalation and inflation; using the wrong estimating technique; failing to use forward pricing rates for overhead, general and administrative, and indirect costs.&quot;,&quot;explanation_ru&quot;:&quot;Нужно учитывать квалификацию, риски, изменение стоимости/инфляцию, подходящую технику оценки и forward pricing rates для указанных категорий.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-43&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Late detection of estimating errors&quot;,&quot;pages&quot;:[24],&quot;question&quot;:&quot;When do many estimating pitfalls unfortunately become evident, according to the lecture?&quot;,&quot;options&quot;:[&quot;Only after every possible follow-on contract has been won.&quot;,&quot;Always before proposal preparation begins.&quot;,&quot;Immediately when the project title is chosen.&quot;,&quot;When the cost control system detects them well into the project.&quot;],&quot;answer&quot;:&quot;D&quot;,&quot;explanation_ru&quot;:&quot;Многие ошибки проявляются лишь в ходе проекта через систему контроля затрат, поэтому ранняя качественная оценка важна.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-44&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Project risk and living plans&quot;,&quot;pages&quot;:[25],&quot;question&quot;:&quot;Which statement best captures the lecture&#x27;s treatment of project risks?&quot;,&quot;options&quot;:[&quot;Risks are activities or factors that, if they occur, increase the probability of failing time, cost or performance goals; living plans may change to prevent or rectify problems, and risk management belongs throughout the project life cycle.&quot;,&quot;A risk exists only after a cost overrun has already occurred.&quot;,&quot;Risk management is required only during termination.&quot;,&quot;Project plans must never change because many risks are controllable.&quot;],&quot;answer&quot;:&quot;A&quot;,&quot;explanation_ru&quot;:&quot;Планы — живые документы. Риски могут помешать срокам, стоимости и результативности; многие можно предвидеть и контролировать, а управление ими ведётся весь жизненный цикл.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-45&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Common project risks&quot;,&quot;pages&quot;:[26],&quot;question&quot;:&quot;Which set reproduces all five common project risks listed on page 26?&quot;,&quot;options&quot;:[&quot;Strong management support, clear requirements, experienced managers, qualified resources and reliable estimates.&quot;,&quot;Poorly defined requirements, lack of qualified resources, lack of management support, poor estimating and an inexperienced project manager.&quot;,&quot;Only inflation, exchange rates, competitor prices, tax changes and weather.&quot;,&quot;An accurate WBS, documented assumptions, updated historical costs, good staffing and regular reviews.&quot;],&quot;answer&quot;:&quot;B&quot;,&quot;explanation_ru&quot;:&quot;На стр. 26 названы ровно эти пять примеров: требования, квалификация ресурсов, поддержка руководства, качество оценки и опыт руководителя.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-46&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;mcq&quot;,&quot;topic&quot;:&quot;Risk identification tools&quot;,&quot;pages&quot;:[27],&quot;question&quot;:&quot;A manager is probing and analyzing available data to identify risks. Which tool set is explicitly listed in the lecture?&quot;,&quot;options&quot;:[&quot;Only task duration estimates and employee salary records.&quot;,&quot;Only the lowest competitor bid and a fixed-price contract.&quot;,&quot;Decision support systems, expected value measures, trend analysis/projections, and independent reviews and audits.&quot;,&quot;A final invoice, a contract signature, a sales slogan and a project logo.&quot;],&quot;answer&quot;:&quot;C&quot;,&quot;explanation_ru&quot;:&quot;Лекция называет risk identification искусством и предлагает четыре группы инструментов. Формула expected value здесь не приведена, поэтому вопрос проверяет знание инструмента, а не внешнюю методику.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-47&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;short&quot;,&quot;topic&quot;:&quot;Risk management process&quot;,&quot;pages&quot;:[28],&quot;question&quot;:&quot;Write the six risk-management steps in the exact order given in Lecture 3.&quot;,&quot;answer&quot;:&quot;1. Identify the risk. 2. Quantify the risk. 3. Prioritize the risk. 4. Develop a strategy for managing the risk. 5. Obtain project sponsor/executive review. 6. Take action.&quot;,&quot;explanation_ru&quot;:&quot;Порядок: выявить → количественно оценить → расставить приоритеты → разработать стратегию → review спонсора/руководства → действовать.&quot;,&quot;difficulty&quot;:&quot;basic&quot;,&quot;id&quot;:&quot;L3-48&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Analogy estimate range calculation&quot;,&quot;pages&quot;:[7],&quot;question&quot;:&quot;Exercise example: An analogy/budget estimate has a base amount of KZT 800,000. Apply Figure 1&#x27;s -10% to +25% range. State the lower and upper amounts, the WBS approach and the typical preparation time.&quot;,&quot;answer&quot;:&quot;Lower = 800,000 × 0.90 = KZT 720,000. Upper = 800,000 × 1.25 = KZT 1,000,000. The approach is top-down and preparation typically takes weeks.&quot;,&quot;explanation_ru&quot;:&quot;Нижняя граница — 90% базы, верхняя — 125%. Это учебные суммы; top-down и weeks взяты из Fig. 1.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-49&quot;,&quot;lecture&quot;:3},{&quot;type&quot;:&quot;calculation&quot;,&quot;topic&quot;:&quot;Class I definitive range calculation&quot;,&quot;pages&quot;:[9],&quot;question&quot;:&quot;Exercise example: Apply Figure 3&#x27;s Class I definitive accuracy of ±5% to a KZT 4,000,000 estimate. State both endpoints and explain why the Figure 1 engineering upper bound is not used.&quot;,&quot;answer&quot;:&quot;Lower = 4,000,000 × 0.95 = KZT 3,800,000. Upper = 4,000,000 × 1.05 = KZT 4,200,000. The question specifies Figure 3 Class I (±5%), not Figure 1 engineering/definitive (-5% to +10%).&quot;,&quot;explanation_ru&quot;:&quot;Оба предела считаются по ±5%, поскольку указан Class I из Fig. 3. Разные диапазоны двух рисунков сохранены в соответствии с источником.&quot;,&quot;difficulty&quot;:&quot;applied&quot;,&quot;id&quot;:&quot;L3-50&quot;,&quot;lecture&quot;:3}]&lt;/script&gt;
&lt;/div&gt;
&lt;style&gt;
  #pm-quiz-155 { color:var(--foreground); overflow-wrap:anywhere; }
  #pm-quiz-155 [hidden] { display:none !important; }
  #pm-quiz-155 .pm-heading { margin-bottom:20px; padding-right:90px; }
  #pm-quiz-155 .pm-space { margin-top:16px; }
  #pm-quiz-155 .pm-options { display:flex; flex-direction:column; gap:14px; }
  #pm-quiz-155 .pm-question { white-space:pre-wrap; margin-block:20px; }
  #pm-quiz-155 .pm-answer-text { white-space:pre-wrap; margin-top:6px; }
  #pm-quiz-155 .pm-session-top { justify-content:space-between; margin-bottom:12px; }
  #pm-quiz-155 .pm-status-c { color:var(--green); }
  #pm-quiz-155 .pm-status-w { color:var(--destructive); }
  #pm-quiz-155 #pm-topic { overflow-wrap:anywhere; }
  @media (max-width:440px) { #pm-quiz-155 .pm-heading { padding-right:0; padding-top:30px; } }
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;pm-quiz-155&#x27;);
  const el = (id) =&gt; root.querySelector(&#x27;#pm-&#x27; + id);
  const bank = JSON.parse(el(&#x27;data&#x27;).textContent);
  const byId = new Map(bank.map(q =&gt; [q.id, q]));
  const letters = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;];
  const version = 2;
  const ownWrites = new Set();
  let state = { v:version, view:&#x27;setup&#x27;, config:{lecture:&#x27;all&#x27;, format:&#x27;all&#x27;, size:&#x27;all&#x27;}, queue:[], at:0, marks:{} };
  let saveTimer;

  function pool() {
    return bank.filter(q =&gt; (state.config.lecture === &#x27;all&#x27; || q.lecture === Number(state.config.lecture)) &amp;&amp;
      (state.config.format === &#x27;all&#x27; || (state.config.format === &#x27;mcq&#x27; ? q.type === &#x27;mcq&#x27; : q.type !== &#x27;mcq&#x27;)));
  }
  function current() { return byId.get(state.queue[state.at]); }
  function mark(q) { return state.marks[q.id] || { choice:-1, status:&#x27;&#x27;, reveal:false, text:&#x27;&#x27; }; }
  function ensureMark(q) {
    if (!state.marks[q.id]) state.marks[q.id] = {choice:-1, status:&#x27;&#x27;, reveal:false, text:&#x27;&#x27;};
    return state.marks[q.id];
  }
  function stats() {
    const result = {autoTotal:0, autoDone:0, autoCorrect:0, selfTotal:0, selfDone:0, selfCorrect:0, partial:0, checked:0, review:[]};
    state.queue.forEach(id =&gt; {
      const q = byId.get(id), m = mark(q);
      if (q.type === &#x27;mcq&#x27;) {
        result.autoTotal++;
        if (m.status) result.autoDone++;
        if (m.status === &#x27;c&#x27;) result.autoCorrect++;
      } else {
        result.selfTotal++;
        if (m.status) result.selfDone++;
        if (m.status === &#x27;c&#x27;) result.selfCorrect++;
        if (m.status === &#x27;p&#x27;) result.partial++;
      }
      if (m.status) result.checked++;
      if (m.status !== &#x27;c&#x27;) result.review.push(id);
    });
    return result;
  }
  function readConfig() {
    state.config = {lecture:el(&#x27;lecture&#x27;).value, format:el(&#x27;format&#x27;).value, size:el(&#x27;size&#x27;).value};
    const available = pool().length;
    const chosen = state.config.size === &#x27;all&#x27; ? available : Math.min(available, Number(state.config.size));
    el(&#x27;pool&#x27;).textContent = chosen + &#x27; вопросов · в разделе &#x27; + available;
    el(&#x27;start&#x27;).disabled = !available;
  }
  function renderSetup() {
    [&#x27;lecture&#x27;,&#x27;format&#x27;,&#x27;size&#x27;].forEach(key =&gt; el(key).value = state.config[key]);
    readConfig();
    el(&#x27;resume&#x27;).hidden = state.queue.length === 0;
  }
  function showView() {
    el(&#x27;setup&#x27;).hidden = state.view !== &#x27;setup&#x27;;
    el(&#x27;session&#x27;).hidden = state.view !== &#x27;quiz&#x27;;
    el(&#x27;results&#x27;).hidden = state.view !== &#x27;results&#x27;;
    if (state.view === &#x27;setup&#x27;) renderSetup();
    else if (state.view === &#x27;quiz&#x27;) renderQuestion();
    else renderResults();
  }
  function shuffle(values) {
    const list = [...values];
    for (let i=list.length-1; i&gt;0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }
  function start(ids) {
    let queue;
    if (ids) queue = [...ids];
    else {
      const candidates = pool().map(q =&gt; q.id);
      queue = state.config.size === &#x27;all&#x27; ? candidates : shuffle(candidates).slice(0, Number(state.config.size));
    }
    if (!queue.length) return;
    state.queue = queue;
    state.at = 0;
    state.marks = {};
    state.view = &#x27;quiz&#x27;;
    showView();
    persist();
  }
  function renderQuestion() {
    const q = current();
    if (!q) { state.view = &#x27;setup&#x27;; showView(); return; }
    const m = mark(q), s = stats(), written = q.type !== &#x27;mcq&#x27;;
    el(&#x27;position&#x27;).textContent = &#x27;Вопрос &#x27; + (state.at+1) + &#x27; / &#x27; + state.queue.length;
    el(&#x27;count&#x27;).textContent = &#x27;Проверено: &#x27; + s.checked;
    const percent = Math.round(s.checked/state.queue.length*100);
    el(&#x27;progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, String(percent));
    el(&#x27;progress-bar&#x27;).style.width = percent + &#x27;%&#x27;;
    el(&#x27;tag&#x27;).textContent = &#x27;Лекция &#x27; + q.lecture + &#x27; · &#x27; + (q.type === &#x27;mcq&#x27; ? &#x27;Выбор ответа&#x27; : q.type === &#x27;calculation&#x27; ? &#x27;Расчёт&#x27; : &#x27;Письменно&#x27;);
    el(&#x27;topic&#x27;).textContent = q.topic;
    el(&#x27;question&#x27;).textContent = q.question;
    el(&#x27;options&#x27;).replaceChildren();
    el(&#x27;options&#x27;).hidden = written;
    el(&#x27;writing&#x27;).hidden = !written;
    if (!written) {
      q.options.forEach((option, index) =&gt; {
